# ==============================================================================
# NavHub (znwzdh) 统一 CI 工作流
#
# 覆盖矩阵：
# 1. test-sqlite（Lite 模式 / 默认引擎）:
#    - 全 Monorepo 类型检查（pnpm typecheck）
#    - 全量 Vitest（SQLite + sqlite-vec + FTS5 CJK 二元分词）
#    - 核心包与 SDK 打包构建（pnpm build）
# 2. test-postgres（Standard 模式 / 企业跨方言引擎）:
#    - pgvector 服务容器注入 NAVHUB_TEST_DATABASE_URL
#      （pg-dialect.e2e.test.ts 与 scripts/pg-check.mts 都只认这个变量名，
#       设成 DATABASE_URL 是没人读的死变量——PG 测试会整套静默 skip，假绿灯）
#    - pg-dialect 跨方言 E2E（12 项断言）+ pg-check.mts 标准模式 12 项基准检验
# 3. test-web（前端门禁，升级改造方案 P1-2）:
#    - vendor 重建 apps/web 后：tsc --noEmit + eslint（flat 配置）+ next build
#    - 覆盖 NavHub 自研的 166 个 overlay 文件（此前零门禁）
#    - check-isr-routes：收录型路由必须是 ISR（●），页面签名不得读 searchParams
# 4. check-isr-live（2026-10-22 新增）:
#    - CI 内自建预览（migrate + seed 的中枢 + next start 产物）跑 --live 抽查，
#      覆盖「产物跑起来之后」：必须 200、必须带 s-maxage、旧 ?page=N 必须 30x
#    - --min-checked=10 兜覆盖率：空 sitemap 时每个族只会打「跳过」，
#      0 页通过曾经会静默绿灯——那是比红灯更坏的失败。10 是按 2026-10-23 本地
#      同构复现实测的 12 页定的（见作业内注释），不是拍脑袋
#    - --sitemap-min-* 盯 sitemap 自己的收录面：抽查只判「抽到的页形态对不对」，
#      某族在 sitemap 里整族归零时抽到的页照样全绿；中枢失联降级成 9 条静态条目
#      也靠这一层红灯（不只看条目总数）
#    - 200 页默认还过一遍技术面契约（title/description/canonical/OG/JSON-LD）：
#      读的是爬虫真正拿到的响应体，分页族按 noindex 设计放宽
#    - 标签族用 scripts/seed-isr-fixtures.mjs 造一个够阈值的标签，否则 /tags/*
#      在 CI 里永远是「跳过」（种子最大标签只挂 5 个站点 < 阈值 10）
#    - 就绪探测盯 /site/* 条目：中枢失联时 sitemap 仍有 9 条静态 <loc>，
#      只看「有没有 <loc>」会误判就绪，门禁随后红在覆盖率上而不是真实原因上
#    - 此前 --live 只存在于 workflow_dispatch 的 seo-audit-prod，等于每个 PR 都没跑
#    - 一次性 AUTH_SECRET 由作业现场生成：生产守卫拒绝仓库内的开发回退密钥，
#      不给的话 next start 每个请求都是 500，门禁会红在无关处
#    - 同一个作业还生成一次性 NAVHUB_INTERNAL_TOKEN 给两侧进程：限流豁免的集成检查
#      （scripts/check-rate-limit-exemption.mjs）需要在小额度下仍能吃得到中枢
# 5. check-web-overlay:
#    - vendor 重建 apps/web 后与 overlay 字节级比对（全新检出的前提，见作业内注释）
# 6. audit: 依赖审计（硬门禁：高危漏洞直接红灯）
# 7. ci-passed:
#    - 聚合闸门作业，供 GitHub 分支保护规则 (Branch Protection Rules) 设置单一必经项
# ==============================================================================

# 供应链：第三方 action 固定到 commit SHA，注释保留可读主版本。
# 升级时用 `git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>` 取新 SHA，
# 不允许直接写可变的 @vN 标签。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 最小权限 + 同分支新 push 自动取消旧运行
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 覆盖仓库本地 .npmrc 的国内镜像源，在 GitHub CI 环境直连官方源以保证网络高可靠
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  test-sqlite:
    timeout-minutes: 20
    # 分片：654 个测试文件单作业跑满 5~7 分钟，且一红就要等整轮才看到结果。
    # 三片并行后墙钟约 1/3；fail-fast: false 让三片都跑完，一次拿到全部失败。
    name: 测试（SQLite 默认方言，分片 ${{ matrix.shard }}/3）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 覆盖层比对在 check-web-overlay 作业里单独跑（全新检出需先 vendor，见那里）
      - run: pnpm run typecheck
        id: typecheck
      # 后端 ESLint（方案 P1-8）：apps/api / packages/store 此前零静态检查。
      # 首轮只开 no-unused-vars / no-empty / no-console 且全部为 warning，
      # 所以这里 continue-on-error：告警看得见，但不阻塞合并。
      # 全量清完告警后再去掉这一行并收紧规则。
      - run: pnpm run lint:backend
        continue-on-error: true
      # apps/web/test/*.test.ts 打的是存储接缝：github.ts 顶层 import @/lib/auth 与
      # @/navsphere/content/*.json。这些同属 gitignore 的生成物（来自上游），全新检出
      # 并不存在 —— 不先 vendor 重建 apps/web，vitest 会以
      # "Cannot find package '@/lib/auth'" 整作业失败。vendor 只重建 apps/web，
      # 而 typecheck / build 都 --filter "@navhub/*"，故不受影响。
      - run: node scripts/vendor-web.mjs
      # JUnit 供 scripts/test-telemetry.mjs 统计 flake 与失败用例（人类可读的
      # default reporter 仍然保留，日志体验不变）。
      # 不能写 `pnpm test -- --shard=...`：pnpm 会把那个 `--` 原样透传给 vitest，
      # 之后的 --shard / --reporter / --outputFile 全被当成文件过滤器吃掉。
      # 实测（run 40671824883）：三片各自跑了全量 473 个文件，junit 0 个产物，
      # 上传步骤靠 if-no-files-found: warn 静默通过——分片和遥测同时失效了三轮。
      - name: 单元/接口测试（分片 ${{ matrix.shard }}/3）
        id: vitest
        run: pnpm test --shard=${{ matrix.shard }}/3 --reporter=default --reporter=junit --outputFile.junit=junit-sqlite-${{ matrix.shard }}.xml
      # 下面三步只在**测试步骤真的跑过**时执行（成功或失败都算）。
      #
      # 为什么不能只写 !cancelled()（2026-10-29 实战）：typecheck 一红，测试步骤被跳过、
      # junit 不存在，而这三步照样跑 ⇒ 「缺 junit 判红」的光谱/台账/上传各自再红一次，
      # 一次根因变成四处红。级联红会淹没真正的根因，也会把「遥测链路断了」这条告警
      # 变成狼来了。判据是 steps.vitest.outcome：skipped 说明根因在上游，这里不掺和。
      #
      # 红灯用例名进 Step Summary：无 token 时 job 日志读不到（/actions/jobs/{id}/logs
      # 恒 403）、本机也拉不到 artifact 内容，「哪一例红了」此前实际不可读。
      # 只读解析，不判定对错——测试红绿由测试步骤负责；本步骤只在产物缺失时红
      # （遥测链路断了必须看得见，与 upload-artifact 的 error 口径一致）。
      - name: 红灯光谱（Step Summary）
        if: ${{ !cancelled() && steps.vitest.outcome != 'skipped' }}
        run: node scripts/junit-summary.mjs junit-sqlite-${{ matrix.shard }}.xml
      # 跨轮对比：junit-summary 只说「这一次红了什么」，说不出「是不是这一轮才红的」。
      # 本步骤拿 docs/ci-red-ledger.json 对账，台账之外的红（含同用例换因）直接判红。
      # 分片视角只看得见自己那一片，所以 check 模式不判定「已修复」——修复由
      # 全量产物下的人工/定时 --update 落账。
      # --strict-ttl：台账条目带到期日，过期仍在红就判失败——台账是「已知的债」，
      # 不是免死金牌（只记账不催收，长期红会变成背景噪音）。
      - name: 红灯台账（跨轮对比 + TTL）
        if: ${{ !cancelled() && steps.vitest.outcome != 'skipped' }}
        run: node scripts/ci-red-ledger.mjs --from junit-sqlite-${{ matrix.shard }}.xml --require-no-new --strict-ttl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && steps.vitest.outcome != 'skipped' }}
        with:
          name: junit-sqlite-${{ matrix.shard }}
          path: junit-sqlite-*.xml
          # 缺 junit = 遥测链路断了，必须红：warn 曾让这条链空转三轮没人发现
          if-no-files-found: error
          retention-days: 7
      # 打包构建闸门：tsc 能过但声明导出/入口路径坏了只有 build 能发现。
      # 只在第 1 片跑：三片各 build 一次是纯浪费，且构建与分片无关。
      - if: matrix.shard == 1
        run: pnpm build

  test-postgres:
    timeout-minutes: 20
    name: 跨方言测试（PostgreSQL）
    runs-on: ubuntu-latest
    env:
      # 未配置时该套件会整体 skip；这里配置了就必须真的连上并全绿
      NAVHUB_TEST_DATABASE_URL: postgres://navhub:navhub@127.0.0.1:5432/navhub_test
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: navhub
          POSTGRES_PASSWORD: navhub
          POSTGRES_DB: navhub_test
        ports:
          - 5432:5432
        # 健康检查：等 PG 真正就绪再跑测试（避免 CI 抖动的连接失败）
        options: >-
          --health-cmd "pg_isready -U navhub -d navhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 只跑 PG 套件（SQLite 套件在 test-sqlite job 已覆盖）。
      # 两个 e2e 套件共用同一实例但各自独占 schema，可并行：
      #   pg-dialect —— Repository 断言跨方言一致（public schema）
      #   rollup-pg   —— 数据治理 rollup 的 $n 占位符 / ON CONFLICT / COUNT(DISTINCT)（rollup_e2e schema）
      # 用带环境守卫的入口：NAVHUB_TEST_DATABASE_URL 缺失时直接失败，
      # 而不是让两个套件整体 skip 后仍然绿灯（2026-10-24 实测过这个假绿）。
      - run: pnpm test:pg:suite
      # 标准模式 12 项真实数据库方言基准检验（同样只认 NAVHUB_TEST_DATABASE_URL）
      - run: pnpm test:pg

  test-web:
    timeout-minutes: 25
    name: 前端门禁（Web typecheck / lint / build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/web 是 gitignore 的 vendored 底座：先重建（上游 + overlay 覆写），
      # 否则 tsc/lint/build 面对的是不存在的目录（与 check-web-overlay 同款前置）
      - run: node scripts/vendor-web.mjs
      # 三门禁。背景：NavHub 自研的 166 个 overlay 文件（/admin 全部页面、
      # /api/hub 代理、navhub-api 等）此前零门禁——根 typecheck 只覆盖
      # @navhub/*，next.config 也 ignoreBuildErrors/ignoreDuringBuilds。
      # 现状基线（2026-10-16 本地实测）：tsc 0 错误、lint 0 错误 259 警告
      # （警告不卡门禁）、next build 通过——故直接按硬门禁启用。
      - run: pnpm --filter navsphere exec tsc --noEmit
      # Next 16 移除了 `next lint`（eslint-config-next@16 改为扁平配置 + ESLint CLI）。
      # 基线（2026-10-16 本地实测，Next 15 时代）：0 错误 259 警告（警告不卡门禁）。
      - run: pnpm --filter navsphere exec eslint .
      - run: pnpm --filter navsphere build
        id: web-build
      # 首屏 JS 预算硬门禁：build 产物已就绪。阈值在 scripts/bundle-budget.json，
      # 不允许为了过门禁上调——超了先优化，再按真实产物重新定基线。
      - run: node scripts/check-bundle-budget.mjs
      # ISR 硬门禁：收录型路由（分类/分页/插件详情/站点详情/标签/合集/站点目录）必须是 ●，
      # 并且页面签名不得读 searchParams。动机：这类路由带 revalidate +
      # generateStaticParams，读了 searchParams 的未预渲染参数在按需生成时直接抛
      # DYNAMIC_SERVER_USAGE（生产 500），而 next dev / tsc / eslint 都照不出来。
      # CI 构建同样没有 NAVHUB_SITE_URL，所以这一条就是在证明「构建期不需要 origin
      # 也能预渲染 /sites」：静态渲染链（根布局 metadataBase + 站点目录）一旦把
      # siteOrigin() 的 headers() 兜底放回来，/sites 退化成 ƒ，这里立刻红灯。
      #
      # 条件必须是 `!cancelled() && web-build.outcome == 'success'`（2026-10-30 加）：
      # 默认条件意味着**上一步红 = 这一步 skipped**，而 skipped 不判红。自 10-29 起
      # 预算门禁常驻红，于是这条 ISR 门禁每轮都被整步跳过——它已经连着几天没判过任何东西，
      # 而作业结论看不出来（红的还是预算那一步，像是「只有预算有问题」）。撤防不报错，
      # 是最贵的一种失效。锚点用 `== 'success'` 而不是账那两步的 `!= 'skipped'`：
      # build 真失败时 `.next` 是半份产物，ISR 读它只会再判一次假红。
      - run: node scripts/check-isr-routes.mjs
        if: ${{ !cancelled() && steps.web-build.outcome == 'success' }}
      # 首屏预算账（只读）：把 check-bundle-budget --report 的三类发现 + 产物出处写成一份
      # 跨轮可对比的账。为什么门禁之外还要它：门禁只答「超没超」，不答「哪几条路由该补
      # 专属预算、哪几条其实可以下调」——那 15+58 条此前只活在本地一次 --report 的 stdout 里。
      # 账自己不判定，数字全部来自 --report --json，所以不会出现第二套预算口径。
      #
      # 条件不能写成 `if: always()`（2026-10-29 改）：always() 的**本意**是「预算门禁红灯时
      # 也要出账」，但它顺带把「build 根本没跑成」也算进来了 —— lint 一红，build 被跳过、
      # `.next` 不存在，账脚本和它那步 `if-no-files-found: error` 的上传各自再判一次红，
      # 一次根因三处红。锚点因此是 web-build：build 跑过（成功或失败）⇒ 账照常出；
      # build 被上游跳过 ⇒ 账闭嘴，红灯留在真正的根因上。同 test-sqlite/test-e2e 的 junit 口径。
      - name: 首屏预算账（Step Summary + artifact）
        if: ${{ !cancelled() && steps.web-build.outcome != 'skipped' }}
        run: node scripts/bundle-budget-summary.mjs --out-json "$RUNNER_TEMP/bundle-budget-report.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && steps.web-build.outcome != 'skipped' }}
        with:
          name: bundle-budget-report
          path: ${{ runner.temp }}/bundle-budget-report.json
          # 这里必须是 error，不是 warn：warn 曾让 junit 那几步「上传绿灯、实际什么都没传」
          # 空转三轮没人发现（run 40671824883）。缺产物要么是链路断了、要么是上游没跑成，
          # 两种都不该被静默吞掉——后者由上面的 outcome 守卫挡在门外。
          if-no-files-found: error
          retention-days: 30

  # --live 抽查此前只存在于 seo-audit-prod（workflow_dispatch + 需要仓库变量
  # NAVHUB_SITE_URL），也就是**每个 PR 都没跑过**：ISR 快照「跑起来之后」是不是
  # 真带 s-maxage、旧 ?page=N 有没有 30x，全靠本地手工实测。
  # 这里在 CI 内自建一套（迁移 + 种子的中枢 + next start 产物），
  # 不依赖外部域名与仓库变量，所以每个 PR 都会跑。
  check-isr-live:
    timeout-minutes: 30
    name: 线上 ISR 抽查（CI 内自建预览，PR 门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/vendor-web.mjs
      # migrate 与 seed 都以仓库根为 CWD：config.ts 的 NAVHUB_SQLITE_PATH 默认是
      # cwd 相对的 ./data/navhub.db（见根 package.json 的 //seed 注释）。
      # seed 不建表，所以必须先 migrate；空库会让 sitemap 为空，--live 每个族
      # 只会打「跳过」，正是 --min-checked 要拦的静默通过。
      - run: node apps/api/src/migrate.ts
      - run: pnpm seed
      # 种子库里最大的标签只挂 5 个站点，低于 MIN_SITES_FOR_TAG_INDEX=10，
      # 于是 /tags/{slug} 永远进不了 sitemap、在门禁里永远打「跳过」—— 一整族是
      # 永久盲区。这一步往一次性预览库补一个挂满 15 个站点的标签（slug=gate-selfcheck），
      # 让 /tags/ 真的有样本可抽。脚本自带护栏：必须显式 NAVHUB_ISR_FIXTURE_DB=1，
      # 否则拒绝运行（防止误写真实库）。
      - name: 补门禁自检标签（仅一次性 CI 库）
        run: node scripts/seed-isr-fixtures.mjs
        env:
          NAVHUB_ISR_FIXTURE_DB: 1
      # 生产守卫（apps/web/src/lib/auth.config.ts）会拒绝仓库内的开发回退密钥，
      # `next start` 走生产分支 —— 不给 AUTH_SECRET 的话预览站每个请求都是 500，
      # 这个门禁就会红在无关处。密钥只在本次作业的一次性 shell 环境里存在，
      # 不进 git、不进日志（预览站不需要能被外部登录）。
      #
      # 顺手一起生成 NAVHUB_INTERNAL_TOKEN（限流豁免的共享凭据）：web 侧那个头是
      # `lib/server/hub.ts` 的**模块顶层常量**，只在进程启动时读一次，所以必须在
      # 「启动 Web 产物」之前就存在于环境里 —— 事后重启 `next start` 是靠不住的
      # （见下面「限流豁免集成检查」步骤里记的实测教训）。两侧同值是这套豁免的前提。
      - name: 生成一次性密钥（会话 + 中枢内部凭据）
        run: |
          node -e "console.log('AUTH_SECRET=' + require('crypto').randomBytes(32).toString('hex'))" >> "$GITHUB_ENV"
          node -e "console.log('NAVHUB_INTERNAL_TOKEN=' + require('crypto').randomBytes(32).toString('hex'))" >> "$GITHUB_ENV"
      # 中枢必须在 build **之前**起来。两条实测证据（2026-10-23 本地同构复现）：
      # 1) `/sitemap.xml` 在产物里是 `compute: "static"` + `initialRevalidateSeconds: 300`
      #    —— 构建期没有中枢，烤出来的就是 9 条纯静态条目的快照（`/site/*` 为 0）；
      #    `next start` 会把这个快照当 HIT 连续供满 300s，就绪探测只等 120s，
      #    于是门禁必然红在「预览站没给出中枢喂好的 sitemap」这一条无关处。
      # 2) 快照本身也可以事后删掉（下一步的 purge），但让构建期就有真数据，
      #    才让这个 job 的产物贴近真实部署（构建时中枢在线）。
      # 记下 PID：`pgrep -f "apps/api/src/main.ts"` 只能算兜底，而「重启中枢再测」这类
      # 步骤如果旧进程没死透，新进程 binds 不上却照样通过就绪探测（打的是旧进程），
      # 于是红灯归因全错。端口是否让开由后面的步骤自己确认。
      - name: 启动中枢（后台）
        run: |
          nohup node apps/api/src/main.ts > /tmp/hub.log 2>&1 &
          echo $! > /tmp/hub.pid
        env:
          PORT: 8787
      # 构建期**给** origin：这个 job 测的是产物跑起来的行为，
      # 「无 origin 能否预渲染」由 test-web 里那条 check-isr-routes 负责，两条互补。
      - run: pnpm --filter navsphere build
        env:
          NAVHUB_SITE_URL: http://localhost:3000
      # 把构建期烤出的 sitemap/robots 快照连同路由缓存一起删掉，逼第一次请求走
      # 真·运行时渲染（读活着的中枢），而不是吃 300s 的旧快照。
      # 只删 `.body`/`.meta` 这一对文件：`server/app/sitemap.xml/` 是同名的**目录**
      # （里面是 route.js），删了会把路由本身删没。
      - name: 清掉构建期烤出的 sitemap 快照
        run: |
          rm -f apps/web/.next/server/app/sitemap.xml.body apps/web/.next/server/app/sitemap.xml.meta \
                apps/web/.next/server/app/robots.txt.body apps/web/.next/server/app/robots.txt.meta
          rm -rf apps/web/.next/server/route-cache
          ls apps/web/.next/server/app | grep -E "sitemap|robots" || echo "（sitemap/robots 快照已清空）"
      # `next start` 必须以 apps/web 为 CWD：它的 app 目录取 process.cwd()，
      # 在仓库根跑会报「react was not found」并起来一个没有任何路由的空应用
      # —— 每个请求都非 2xx，就绪探测等满 120s 后红灯（2026-10-23 实测：
      # 根目录起 → curl 拿不到 sitemap.xml；apps/web 起 → 立刻 137 条 /site 57 条）。
      - name: 启动 Web 产物（next start，后台）
        working-directory: apps/web
        run: nohup node node_modules/next/dist/bin/next start -p 3000 > /tmp/web.log 2>&1 &
        env:
          NAVHUB_SITE_URL: http://localhost:3000
      - name: ISR 线上抽查
        # 就绪判据要盯「中枢喂进来的条目」（/site/{id}），不是任意 <loc>：
        # 中枢没起时 sitemap 仍会给出 9 条纯静态条目、照样含 <loc>，探测会误判就绪，
        # 然后门禁只在 3 页上红——红在无关处，日志里看不出现在这个原因。
        #
        # --min-checked=10 的标定来自 2026-10-23 的本地同构复现（新 migrate + 新 seed
        # 库 + fixture 标签 + next start 产物，--sample=2）：白名单 9 族实际抽到 12 页
        # （首页 1、分类 1+分页 1、站点目录 1+分页 1、插件市场 2、站点详情 2、
        # 标签 1（来自上面那个 fixture 标签）、合集 2）。下限取 10 留 2 页余量：
        # 单一种子数据变薄可以容忍，中枢整条链路失联（只剩 9 条静态 ⇒ 3 页）必须红。
        #
        # --sitemap-min-* 是另一层：抽查只看「sitemap 里已有的页」形态对不对，sitemap
        # 自己漏掉一整族时抽到的页照样全绿。下限按同一份实测（站点 57 / 分类 1 /
        # 标签 1 / 合集 6 / 插件 64 / 目录 1，lastmod 覆盖 93%）留余量；
        # 站点详情那一条同时就是「中枢失联只剩静态条目」的降级形态红灯。
        #
        # 技术面契约（title/description/canonical/OG/JSON-LD）默认开启：断的是
        # 爬虫真正拿到的那份响应体，和产物门禁、本地 seo-audit 各管一段。
        #
        # --rotate="$GITHUB_SHA"：样本不再永远是「族内前 2 个」。CI 的 seed 库有 57 个
        # 站点详情，固定取样意味着 55 个页的契约退化永远看不见；按 commit 散列轮换后
        # 每个 commit 扫不同的一批，跨 commit 累积覆盖。同一个 SHA 永远抽同一批页
        # （重跑、比对、复现红灯都靠它），日志第一行就打出生效的 key，
        # 本地 `--rotate=<那个 SHA>` 就能重放那一轮。
        run: |
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/sitemap.xml | grep -q "<loc>http://localhost:3000/site/"; then ready=1; break; fi
            sleep 2
          done
          smcount=$(curl -sf http://localhost:3000/sitemap.xml | grep -c '<loc>' || true)
          if [ "$ready" != "1" ]; then
            echo "::error::sitemap 120s 内没有 /site/* 条目（中枢失联或 seed 空），当前条目数 ${smcount}"
            tail -20 /tmp/hub.log /tmp/web.log || true
            exit 1
          fi
          set +e
          node scripts/check-isr-routes.mjs --live --base=http://localhost:3000 --sample=2 \
            --min-checked=10 \
            --rotate="$GITHUB_SHA" \
            --sitemap-min-site=20 --sitemap-min-category=1 --sitemap-min-tag=1 \
            --sitemap-min-collection=1 --sitemap-min-plugin=10 --sitemap-min-directory=1 \
            --sitemap-min-lastmod-ratio=0.8 > /tmp/isr-live.log 2>&1
          rc=$?
          set -e
          cat /tmp/isr-live.log
          if [ "$rc" != "0" ]; then
            # 无 token 时作业日志接口是 403，跨机器只剩 annotations 可读，而且
            # 消息必须「无条件」发：上一版按 grep 匹配行发，门禁自己抛异常时
            # 一行都不剩，等于白加。这里固定发三条 —— 判据数字 + 输出尾部原文 + 层级归因。
            printf '::error::ISR 门禁 rc=%s，sitemap 条目 %s，红行 %s 条，覆盖行：%s\n' \
              "$rc" "$smcount" "$(grep -c '^✖' /tmp/isr-live.log || true)" \
              "$(grep -oE '共 [0-9]+ 页|[0-9]+ 页形态正确|只覆盖到 [0-9]+ 页' /tmp/isr-live.log | tr '\n' '/' | sed 's/::/--/g')"
            printf '::error::输出尾部：%s\n' \
              "$(tail -c 600 /tmp/isr-live.log | tr '\n%' '|')"
            # 再补一条「哪一层红」：收录面族计数原样带出（抽到的页全绿但某族归零，
            # 只看红行数分辨不出来），顺带报契约红灯的条数。
            printf '::error::收录面：%s | 契约红灯 %s 条\n' \
              "$(grep -o '共 [0-9]* 条：[^；]*' /tmp/isr-live.log | head -1 | sed 's/::/--/g')" \
              "$(grep -c '技术面契约不达标' /tmp/isr-live.log || true)"
            exit "$rc"
          fi
      # sitemap 族下限（与上一步 --live 的 --sitemap-min-* 同值）：link-graph 的
      # --from-sitemap 只保证分母非空，sitemap 若只剩首页，分母非空且可达率仍可能
      # 100% —— 这是「空分母」之外的第二种同义反复。族下限把它变成显式红灯。
      # 这里不传 --check：可达率/入链/软 404 那组全站阈值对小种子库不成立，
      # 而族下限一经传入即断言，两者互不绑架。此前这段逻辑只活在 workflow_dispatch
      # 的 seo-audit-prod 里，普通 PR 从没执行过。
      - name: 站内链接图的 sitemap 族下限
        run: |
          node scripts/link-graph.mjs --from-sitemap --base=http://localhost:3000 \
            --max-urls=4000 --no-probe --out=/tmp/link-graph.json \
            --sitemap-min-site=20 --sitemap-min-category=1 --sitemap-min-tag=1 \
            --sitemap-min-collection=1 --sitemap-min-plugin=10 --sitemap-min-directory=1
      - name: 语料基线是否过期（只提示，不阻断）
        # 变异自证那 6 份语料是**某天某库**的真实渲染快照；head 形状一变（多一块
        # JSON-LD、og 换逐页图、title 模板改），旧语料照样让自证全绿，但那已经不是
        # 爬虫今天拿到的页面 —— 契约层重新变成「自证通过、实际失明」。
        # 这一条把它做成可判定的：拿同一个预览站现抓一遍，比 shape + 契约裁决。
        # 刻意**不阻断**：CI 种子库只有 57 个站点，某些「按内容量才出」的模块本来就
        # 和 996 站点库的快照不同，那是数据形态差异不是代码退化；红了也只发 warning，
        # 由人决定要不要重抓语料。首次 run 看这条的族名单，噪声大就把口径改成
        # 「只在 --only=site-detail,category 上比」。
        run: |
          set +e
          node scripts/capture-isr-corpus.mjs --base=http://localhost:3000 --check > /tmp/corpus-check.log 2>&1
          rc=$?
          set -e
          cat /tmp/corpus-check.log
          if [ "$rc" != "0" ]; then
            fams=$(grep -oE '^✖ [a-z-]+' /tmp/corpus-check.log | awk '{print $2}' | tr '\n' ',')
            printf '::warning::ISR 契约语料可能已过期（rc=%s，族=%s）—— 变异自证正拿旧形状当基准；对着跑起来的站点执行 `node scripts/capture-isr-corpus.mjs --base=<origin>`，把 scripts/fixtures/isr-live-corpus/*.html 一起提交\n' \
              "$rc" "${fams%,}"
          fi
      - name: 限流豁免集成检查（小额度下只重启中枢）
        # 为什么单独立一条而不是复用上面那轮：豁免的因果链需要一个「公开请求会被打穿」
        # 的额度才存在（生产 300/min，CI 里几十次请求根本撞不到），所以这里把中枢按
        # 小额度重启一次，让四阶段各自能真的红。
        #
        # web 侧**不重启**（2026-10-23 实测教训）：内部凭据头是 `lib/server/hub.ts` 的
        # **模块顶层常量**，只在进程启动时读一次，所以它必须在「启动 Web 产物」之前
        # 就进环境（见上面「生成一次性密钥」）。上一版在这里重启 web，用
        # `pgrep -f "next/dist/bin/next start"` 找旧进程 —— Next 会把 process.title 改成
        # `next-server (v16.x)`，argv 区被覆盖，pgrep 一个都匹配不到，于是旧进程继续占着
        # 3000 端口、新进程 EADDRINUSE 立刻退出，阶段 3 抽到的 20 页全是「不带凭据的 web
        # 打穿 40/min 额度」的降级壳 —— 看着像产品红灯，其实是脚手架红灯。
        #
        # 顺序：
        #  1) 杀掉中枢（先按启动时记下的 PID，再按 argv 兜底），并确认 8787 真的
        #     没人应答 —— 旧进程没死就硬失败，不带着它往下跑；
        #  2) 起小额度中枢并等 /api/health 就绪（凭据从 $GITHUB_ENV 继承，与 web
        #     启动时读到的是同一个值，这正是不用重启 web 的原因）；
        #  3) 清**两层**缓存：`server/route-cache`（页面快照）+ `.next/cache/fetch-cache`
        #     （Next 的 Data Cache）。只清前一层不够 —— Data Cache 还热的话 SSR 根本
        #     不打中枢，这一轮等于没在受限中枢面前渲染过，阶段 3 是假绿灯；
        #  4) 预热：中枢换过一次进程，web 里那个连接池可能还攥着旧 socket，第一次取数
        #     会撞上 ECONNRESET —— 它和「没吃到豁免」长成同一个壳。所以在额度**还没抽干**
        #     的时候先重试到现渲染出一页正文（这一轮出壳只可能是脚手架/连接抖），
        #     把不确定性挡在判别之前；
        #  5) 判别性预检：抽干公开额度后经 web 现渲染 sitemap **尾部**那一页，
        #     壳 = web 没吃到豁免 ⇒ 报「检查没跑成」并附上端口占用者，
        #     别让阶段 3 替脚手架背锅（上一轮的红灯就是这么被误读成豁免失效的）。
        # 阶段 3 抽 sitemap 的尾部页，与 --live 的族内前几个天然错开，
        # 所以这一步放在最后：前面的门禁不会被小额度波及，这一步也不会吃到上一轮的缓存。
        run: |
          # 只在硬失败时用来回答「谁还占着端口」，不参与判据
          port_owner() {
            ss -ltnp 2>/dev/null | grep -E ":$1[^0-9]" | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -1
          }
          # 壳的判据与 scripts/lib/rate-limit-check.mjs 的 probePage 同一把尺
          is_shell() { printf '%s' "$1" | grep -qi 'noindex' || ! printf '%s' "$1" | grep -qiE '<h1[ >]'; }
          purge_caches() {
            rm -rf apps/web/.next/server/route-cache apps/web/.next/cache/fetch-cache
            rm -f apps/web/.next/server/app/sitemap.xml.body apps/web/.next/server/app/sitemap.xml.meta
          }
          if [ -z "${NAVHUB_INTERNAL_TOKEN:-}" ]; then
            printf '::error::NAVHUB_INTERNAL_TOKEN 没进环境：web 与中枢都拿不到凭据，豁免无法验证（拒绝静默通过）\n'
            exit 1
          fi
          hub_pid=$(cat /tmp/hub.pid 2>/dev/null || true)
          if [ -n "${hub_pid:-}" ]; then kill "$hub_pid" 2>/dev/null || true; fi
          pgrep -f "apps/api/src/main.ts" 2>/dev/null | xargs -r kill 2>/dev/null || true
          gone=0
          for i in $(seq 1 20); do
            if ! curl -s -o /dev/null --max-time 2 http://127.0.0.1:8787/api/health; then gone=1; break; fi
            sleep 1
          done
          # SIGTERM 走的是优雅停机：`runner.drain(30_000)` 先等 in-flight 任务跑完，
          # 这期间 HTTP 服务仍在 listen —— 20s 等待会输给 30s drain（2026-10-23 run
          # 39927865859 实测：20s 后 pid 仍在、8787 仍应答）。CI 用一次性库，不需要
          # 等业务收尾，直接 SIGKILL 让端口让开；再等 10s 仍不退出才红。
          if [ "$gone" != "1" ]; then
            if [ -n "${hub_pid:-}" ]; then kill -9 "$hub_pid" 2>/dev/null || true; fi
            pgrep -f "apps/api/src/main.ts" 2>/dev/null | xargs -r kill -9 2>/dev/null || true
            for i in $(seq 1 10); do
              if ! curl -s -o /dev/null --max-time 2 http://127.0.0.1:8787/api/health; then gone=1; break; fi
              sleep 1
            done
          fi
          if [ "$gone" != "1" ]; then
            printf '::error::旧中枢 SIGKILL 后 10s 还在应答 8787（pid=%s）—— 小额度中枢起不来，检查没跑成，不是豁免失效\n' "$(port_owner 8787)"
            exit 1
          fi
          # 中枢：公开额度 40/min（阶段 1 打 60 次必然被穿），凭据与 web 侧同源
          PORT=8787 NAVHUB_RATE_LIMIT_MAX=40 nohup node apps/api/src/main.ts > /tmp/hub-limited.log 2>&1 &
          echo $! > /tmp/hub-limited.pid
          hub=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787/api/health > /dev/null; then hub=1; break; fi
            sleep 1
          done
          if [ "$hub" != "1" ]; then
            printf '::error::小额度中枢 60s 内没通过 /api/health（8787 现在归 pid=%s）—— 检查没跑成，不是豁免失效\n' "$(port_owner 8787)"
            tail -20 /tmp/hub-limited.log || true
            exit 1
          fi
          # 预热（额度未抽干）： sitemap 现渲染 + 头部那一页现渲染，最多三次
          warm=0
          for i in $(seq 1 3); do
            purge_caches
            sm=$(curl -sf --max-time 30 http://localhost:3000/sitemap.xml || true)
            # 每条赋值管道都带 || true：runner 默认可能是 -e（甚至 -eo pipefail），
            # grep 没匹配到会让整条赋值返回非 0，把「渲染链没跑通」误炸成步骤退出码 1
            head_url=$(printf '%s\n' "$sm" | grep -oE '<loc>[^<]*/site/[^<]*' | head -1 | sed 's|<loc>||' || true)
            tail_url=$(printf '%s\n' "$sm" | grep -oE '<loc>[^<]*/site/[^<]*' | tail -1 | sed 's|<loc>||' || true)
            if [ -n "${head_url:-}" ] && [ -n "${tail_url:-}" ] && ! is_shell "$(curl -s --max-time 30 "$head_url" || true)"; then
              warm=1
              break
            fi
            sleep 3
          done
          if [ "$warm" != "1" ]; then
            printf '::error::预检失败：公开额度还没抽干，三次都现渲染不出一页正文（sitemap %s 字节、/site/* 条目 %s 条）—— web→中枢的渲染链本身没跑通（连接池/中枢没就绪），与豁免无关\n' \
              "${#sm}" "$(printf '%s\n' "$sm" | grep -cE '<loc>[^<]*/site/[^<]*' || true)"
            printf '::error::3000=%s 8787=%s | 中枢日志尾部：%s\n' \
              "$(port_owner 3000)" "$(port_owner 8787)" "$(tail -c 400 /tmp/hub-limited.log | tr '\n%' '|')"
            tail -20 /tmp/hub-limited.log /tmp/web.log || true
            exit 1
          fi
          # 抽干公开额度（40/min 打 45 次）：此后任何没吃到豁免的 SSR 取数都会变成壳
          for i in $(seq 1 45); do
            curl -s -o /dev/null --max-time 5 "http://127.0.0.1:8787/api/sites?page=1&pageSize=1" || true
          done
          # 判别性预检用尾部那一页：头部那页刚被预热渲染成正文，读它是吃缓存
          body=$(curl -s --max-time 30 "$tail_url" || true)
          if is_shell "$body"; then
            printf '::error::预检失败：公开额度（40/min）抽干后 web 现渲染的 %s 是降级壳（正文 %s 字节）—— web 侧没吃到豁免。本步骤不重启 web，凭据来自「生成一次性密钥」；先确认 3000 上的 next-server（pid=%s）启动时环境里有 NAVHUB_INTERNAL_TOKEN，再怀疑渲染代码\n' \
              "$tail_url" "${#body}" "$(port_owner 3000)"
            printf '::error::中枢日志尾部：%s\n' "$(tail -c 400 /tmp/hub-limited.log | tr '\n%' '|')"
            exit 1
          fi
          set +e
          node scripts/check-rate-limit-exemption.mjs \
            --api-base=http://127.0.0.1:8787 --web-base=http://localhost:3000 \
            --public-hammer=60 --pages=20 --min-miss=8 > /tmp/rate-limit.log 2>&1
          rc=$?
          set -e
          cat /tmp/rate-limit.log
          if [ "$rc" != "0" ]; then
            # 失败时无条件发三条：上一版按 grep 匹配行发，脚本自身抛异常时一行都不剩。
            # 只报凭据长度，日志里拿不到值。
            printf '::error::限流豁免检查 rc=%s（1=某阶段不成立，2=缺 NAVHUB_INTERNAL_TOKEN），额度=40/min，凭据长度=%s\n' \
              "$rc" "${#NAVHUB_INTERNAL_TOKEN}"
            printf '::error::阶段计数：%s\n' \
              "$(grep -oE '阶段 [0-9][^—]*' /tmp/rate-limit.log | head -4 | tr '\n%' '|')"
            printf '::error::输出尾部：%s\n' "$(tail -c 700 /tmp/rate-limit.log | tr '\n%' '|')"
            exit "$rc"
          fi
          # 绿灯也要能被外部读到：本机没有 gh、也没有 token，作业日志接口是 403，
          # annotations 是唯一的出口。少了这一行，「步骤 success」和「四阶段各自真的成立」
          # 之间就只能靠人信一次 —— 而这条检查的全部意义恰恰是「不靠信」。
          printf '::notice::限流豁免四阶段成立（额度=40/min，凭据长度=%s）：%s\n' \
            "${#NAVHUB_INTERNAL_TOKEN}" \
            "$(grep -oE '阶段 [0-9][^—]*' /tmp/rate-limit.log | head -4 | tr '\n%' '|')"
      - name: 失败时留下预览站日志
        if: ${{ failure() }}
        run: |
          for f in /tmp/hub.log /tmp/web.log /tmp/hub-limited.log; do
            echo "===== $f"
            tail -80 "$f" 2>/dev/null || echo "（没有这一份日志）"
          done

  check-web-overlay:
    timeout-minutes: 15
    name: 覆盖层与扩展规范性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 语法快速门禁：解析级检查，不依赖 vendor，几秒内定位标点级错误
      - run: node scripts/check-syntax.mjs
      # 依赖完整性：装残的包会让几百个测试套件同时报「找不到模块」，看起来像代码全坏
      # （2026-10-29 本地一天两次）。CI 也跑，否则干净检出后 node_modules 损坏时无从发现。
      - run: node scripts/check-deps-integrity.mjs
      # 视频链路的作用域化类型门禁：自动发现 src/lib/video-*.ts 与 webhook-*.ts
      # （70 个），断言 0 错误。整棵 overlay 的 ignoreBuildErrors 暂时关不掉
      # （21600+ 既有错误），但这条链路必须保持干净 —— 否则「类型不存在却一路绿灯」
      # 那类问题（HarvestRunReport）会再次发生。只读 apps/web-overlay，不需要 vendor。
      - run: node scripts/typecheck-video-scope.mjs
      # apps/web 是 gitignore 的生成物：全新检出只剩 12 个已跟踪文件，直接比对必然"缺失"
      # （这正是 main 长期红灯的原因）。先用 vendor 重建 apps/web = 上游 + overlay，
      # overlay 覆写优先，之后比对即为真；顺带也 smoke test 了 Docker/vendor 这条路径。
      - run: node scripts/vendor-web.mjs
      # overlay 是 Docker 构建与 vendor 的事实源；apps/web 改了没同步回去会在这里失败
      - run: node scripts/check-web-overlay.mjs
      # core 纯算法的前端运行时副本必须与 packages/core 事实源逐字节一致
      # （历史事故：13 个镜像里 9 个悄悄漂移，knowledge-graph 前端缺 computeGraphCentrality）
      - run: node scripts/sync-core-mirrors.mjs --check
      # 上游底座 ref 三处声明（vendor 脚本 / Dockerfile / UPSTREAM.md）同源，且产物未漂移
      - run: node scripts/check-upstream-ref.mjs
      # 验证浏览器扩展 (Chrome Manifest V3) 与桌面扩展 (Raycast) 的规范与文件完整性
      - run: node scripts/check-extensions.mjs

  test-e2e:
    timeout-minutes: 30
    # 12.3 分钟是 CI 的最长杆。按 spec 分两片并行（每片仍 workers=1，
    # 保持「本地 SQLite 不并发写」这一前提不变）。
    name: 浏览器 E2E 自动化测试（Playwright，分片 ${{ matrix.shard }}/2）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/vendor-web.mjs
      - name: 安装 Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: 执行 Playwright E2E 测试
        id: e2e
        run: |
          set +e
          # 同单元测试：`pnpm test:e2e -- …` 的 `--` 会被透传给 playwright，
          # 后面的 --shard/--reporter 全被当成文件过滤器（实测两个「分片」各跑了全量）
          PLAYWRIGHT_JUNIT_OUTPUT_NAME=junit-e2e-${{ matrix.shard }}.xml pnpm test:e2e --shard=${{ matrix.shard }}/2 --reporter=list --reporter=junit 2>&1 | tee /tmp/e2e.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            # 红灯必须自带「红在哪条用例」。原因不是偷懒：没有 GitHub token 时
            # `/actions/jobs/{id}/logs` 恒 403、playwright-report 产物恒 total_count:0，
            # 跨机器（和下一个会话）只剩 annotations 可读，而 step 自己只会留
            # 「Process completed with exit code 1.」这一级噪声 —— 于是「哪条用例红了」
            # 只能靠本地复跑猜，猜不出来就只能干等。
            # list reporter 在末尾打「N failed」小节，每条是 `spec.ts:line:3 › 标题`，
            # 直接抽它；解析不到也照样发（无条件发，否则脚本一挂就又回到零信息）。
            failed=$(awk '/^ *[0-9]+ failed/{f=1;next} f && /^ {4}\[/ {sub(/^ +/, ""); print; next} f { exit }' /tmp/e2e.log | tr '\n' '/')
            echo "::error::E2E rc=${rc}；失败用例：${failed:-（未解析到，见下方抽样）}"
            echo "::error::报错抽样：$(grep -m 3 -E 'Error: |expect\(|Test timeout|Target crashed' /tmp/e2e.log | tr '\n' '|')"
            exit "$rc"
          fi
      # 同单元测试：失败用例名进 Step Summary。awk 抽 list reporter 的兜底仍保留
      # （它在测试步骤内部、红灯时立即发 ::error::），这里补的是结构化、可累积的账。
      # 三步都只在 E2E 步骤真的跑过时执行：安装/构建阶段的红不该再变成「缺 junit」的红。
      - name: 红灯光谱（Step Summary）
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        run: node scripts/junit-summary.mjs junit-e2e-${{ matrix.shard }}.xml
      # 同单元测试：与 docs/ci-red-ledger.json 对账，台账之外的红判失败。
      # E2E 的 flake 历史上很常见（见 2026-10-23 的徽章 toast 间歇红），
      # 台账正是为了让「每轮都红的已知项」不再淹没「本轮新引入的红」。
      # --strict-ttl：过期未修同样判红，避免「已知红」永久躺在账上。
      - name: 红灯台账（跨轮对比 + TTL）
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        run: node scripts/ci-red-ledger.mjs --from junit-e2e-${{ matrix.shard }}.xml --require-no-new --strict-ttl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        with:
          name: junit-e2e-${{ matrix.shard }}
          path: junit-e2e-*.xml
          # 同单元测试：缺 junit 就是遥测链路断了，不能靠 warn 静默放行
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          # 通过时 html reporter 不产出报告目录，默认的 warn 会在绿灯 job 上挂一条
          # "No files were found" 注解，掩盖真正的告警；失败时报告仍会被上传。
          if-no-files-found: ignore
          retention-days: 14

  docker-smoke:
    timeout-minutes: 30
    name: 镜像冒烟构建（api / web）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # CI 此前从不构建镜像：Dockerfile 坏了只有用户拉镜像时才发现。
      # 这里只验证"能构建出镜像"，不推送；Web 镜像的上游底座在 Dockerfile 内自取。
      - name: 构建 API 镜像
        run: docker build -f docker/Dockerfile.api -t navhub/api:ci .
      - name: 构建 Web 镜像
        run: docker build -f docker/Dockerfile.web -t navhub/web:ci .

  audit:
    timeout-minutes: 10
    name: 依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 依赖高危漏洞阻断（此前为 continue-on-error 软门禁，已收紧）。
      # 例外 GHSA-vfj7-8cjw-p6xm（braces，经 vendored eslint toolchain 间接引入，
      # dev-only 且上游尚未发布修复版——npm 最新仍是 3.0.3，override 无版本可钉）：
      # 待修复版发布后去掉 --ignore 并改用 overrides 钉版本。
      # 注意：必须用 --registry 显式指向 npmjs；仓库 .npmrc 固定了 npmmirror，
      # 其实测 NPM_CONFIG_REGISTRY 环境变量覆盖对 audit 不生效，会报 endpoint 不存在。
      # 全量审计：含 dev 依赖（构建链漏洞同样能打进产物）
      - run: pnpm --registry=https://registry.npmjs.org audit --audit-level high --ignore GHSA-vfj7-8cjw-p6xm
      # 生产面审计：只看法务/线上真正可触达的依赖，dev-only 告警不阻断交付
      # （--prod 会忽略 devDependencies 树，因此不需要 --ignore）
      - run: pnpm --registry=https://registry.npmjs.org audit --prod --audit-level high

  # 运行时线上检查：只对着**真实生产域名**跑，不进 PR 门禁。
  # 与 check-isr-live 的分工：那个作业在 CI 内自建预览（migrate + seed + next start），
  # 每个 PR 都跑，覆盖 ISR 抽查这一步；这里跑的是全量 SEO 审计 + 生产数据下的
  # 链接图阈值，需要仓库变量 NAVHUB_SITE_URL 指向线上，本地起不出等价条件。
  # 未配置变量时 job 直接 skip，不产生噪音；失败只让本 job 红灯并留下 artifact。
  seo-audit-prod:
    timeout-minutes: 30
    name: 运行时线上检查（生产预览，非 PR 门禁）
    if: github.event_name == 'workflow_dispatch' && vars.NAVHUB_SITE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # 无第三方依赖，无需 pnpm install。--json 把报告写到文件；
      # 发现问题时脚本退出码为 1，本 job 红灯即通知，artifact 仍会因 always() 上传。
      - name: 全量审计（sitemap 最多 2000 条）
        run: node scripts/seo-audit.mjs --base="$NAVHUB_SITE_URL" --limit=2000 --retries=2 --json > seo-audit-report.json
        env:
          NAVHUB_SITE_URL: ${{ vars.NAVHUB_SITE_URL }}
      # 线上形态的 ISR 实证 —— 与 check-isr-live 作业跑**同一套三层契约**
      # （抽查页 s-maxage / 本机地址兜底 + 逐页技术面契约 + sitemap 族下限与 lastmod 覆盖率），
      # 只有阈值按生产规模重标定。
      # 口径实测（2026-10-23，本地 **prod 模式**复现：`next build` + `next start` 起
      # 996 站点库，NAVHUB_SITE_URL 运行时注入）：sitemap 1126 条，
      # 族为 站点 996 / 分类 36 / 标签 16 / 合集 4 / 插件 65 / 目录 1，lastmod 覆盖 1101/1126（98%），
      # 不可收录形态（/p/{n} 与带 query 的 loc）0 条，抽到的 14 页 **全部带
      # `s-maxage=60, stale-while-revalidate=31535940`** 且技术面契约全绿 ⇒ 这一层不再只是推断。
      # 早前用 next dev 做代理测量时「没有 s-maxage」14 项全红，那是 dev 无静态生成导致的
      # 预期红，已被这一轮 prod 模式复现取代；仍然没被覆盖的只有「生产 CDN/反代会不会
      # 改写 cache-control」这一跳 —— 若真实 dispatch 红在那儿，是真问题，不是门禁坏了。
      # 下限取实测的 1/5～1/3：低到不会因正常增删抖动而红，又能在「某族整族丢失」
      # （sitemap 生成侧抛错、取数被截断）时立刻红。
      # 这里不需要 CI 那个「门禁自检标签」：CI 补标签是因为种子库最大标签只有 5 个站点，
      # 够不到 MIN_SITES_FOR_TAG_INDEX=10；生产有 16 个达标标签，天然抽得到样本。
      # --rotate="$GITHUB_SHA"：996 个站点详情页不可能每轮全扫，固定样本等于永远只测
      # 同一批；按 commit 散列轮换把覆盖面摊开，同一 SHA 可复现（日志打 key）。
      - name: ISR 线上抽查（三层契约，生产阈值）
        run: |
          node scripts/check-isr-routes.mjs --live --base="$NAVHUB_SITE_URL" --sample=2 \
            --min-checked=8 \
            --rotate="$GITHUB_SHA" \
            --sitemap-min-site=200 --sitemap-min-category=10 --sitemap-min-tag=5 \
            --sitemap-min-collection=2 --sitemap-min-plugin=20 --sitemap-min-directory=1 \
            --sitemap-min-lastmod-ratio=0.9
        env:
          NAVHUB_SITE_URL: ${{ vars.NAVHUB_SITE_URL }}
      # 链接架构阈值（孤岛页 / 点击深度 / 软 404）。--from-db=none：这里没有生产库，
      # 「应有页面」分母改由站点自己的 sitemap 提供（--from-sitemap）——只看 BFS
      # 发现的 URL 会让可达率恒为 100%（入链为 0 的页面根本不会被走到）。
      # max-urls 必须高于 sitemap 条目数（约 1100→图上 2200+），截断会被 --check 判红。
      # 族下限与 check-isr-routes 共用同一组阈值，挡住「sitemap 整族丢失 → 分母变空 →
      # 可达率虚假 100%」这第二种同义反复。
      - name: 站内链接图阈值检查
        run: |
          node scripts/link-graph.mjs --check --from-db=none --from-sitemap \
            --base="$NAVHUB_SITE_URL" --max-urls=4000 \
            --sitemap-min-site=200 --sitemap-min-category=10 --sitemap-min-tag=5 \
            --sitemap-min-collection=2 --sitemap-min-plugin=20 --sitemap-min-directory=1
        env:
          NAVHUB_SITE_URL: ${{ vars.NAVHUB_SITE_URL }}
      # 首页 HTML 预算（解压后字节数）。**只能挂在这个作业，不能挂 PR 门禁**：
      # 预算的分母是内容量，PR 里的种子库只有几十个站点，量出来永远 2MB 以下，
      # 挂上去等于加一条必然绿灯的假门禁；这里才是唯一带真实站点库的运行环境。
      # 阈值来历（2026-10-26 实测，约 1000 站点）：每组首屏 6 张渐进披露后 3556KB，
      # 改造前 6856KB；4096 留约 15% 余量给正常增删。超阈即说明又有整块数据被塞回首屏 HTML。
      # 若内容量真的翻倍而超阈，请在**同一个提交**里上调本值并在注释里写清新的分母，
      # 不要只改数字——数字是这条哨兵唯一的语义。
      - name: 首页 HTML 预算（解压后，真实数据）
        run: node scripts/html-budget.mjs --url="$NAVHUB_SITE_URL" --max-kb=4096
        env:
          NAVHUB_SITE_URL: ${{ vars.NAVHUB_SITE_URL }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: seo-audit-report
          path: seo-audit-report.json
          if-no-files-found: ignore
          retention-days: 14

  ci-passed:
    name: CI 整体通过 (All Checks Passed)
    runs-on: ubuntu-latest
    needs: [test-sqlite, test-postgres, test-web, check-web-overlay, check-isr-live, test-e2e, docker-smoke, audit]
    if: always()
    steps:
      - name: 评估检查结果
        run: |
          if [ "${{ needs.test-sqlite.result }}" != "success" ] || \
             [ "${{ needs.test-postgres.result }}" != "success" ] || \
             [ "${{ needs.test-web.result }}" != "success" ] || \
             [ "${{ needs.check-web-overlay.result }}" != "success" ] || \
             [ "${{ needs.check-isr-live.result }}" != "success" ] || \
             [ "${{ needs.test-e2e.result }}" != "success" ] || \
             [ "${{ needs.docker-smoke.result }}" != "success" ] || \
             [ "${{ needs.audit.result }}" != "success" ]; then
            echo "CI 检查未全部通过！"
            echo "SQLite:   ${{ needs.test-sqlite.result }}"
            echo "PG:       ${{ needs.test-postgres.result }}"
            echo "Web:      ${{ needs.test-web.result }}"
            echo "Overlay:  ${{ needs.check-web-overlay.result }}"
            echo "ISR live: ${{ needs.check-isr-live.result }}"
            echo "E2E:      ${{ needs.test-e2e.result }}"
            echo "Docker:   ${{ needs.docker-smoke.result }}"
            echo "Audit:    ${{ needs.audit.result }}"
            exit 1
          fi
          echo "🎉 所有 CI 检查均已顺利通过！"
