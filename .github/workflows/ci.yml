# CI：类型检查 + SQLite 测试 + **PostgreSQL 跨方言测试**。
#
# PG job 的意义：仓库里 Repository 的 SQL 大多双方言共用，仅占位符/布尔/聚合
# 走分支（见 packages/store/test/dialect.test.ts 对历史坑的记录）。此前 PG 侧
# 只有手工脚本 scripts/pg-check.mts，没人跑就会静默回归。这里用 postgres
# service 把 NAVHUB_TEST_DATABASE_URL 注入 packages/store/test/pg-dialect.e2e.test.ts，
# 让 PG 行为与 SQLite 断言跑同一批用例。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 最小权限 + 同分支新 push 自动取消旧运行
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-sqlite:
    name: 测试（SQLite 默认方言）
    runs-on: ubuntu-latest
    env:
      # 仓库 .npmrc 固定了 npmmirror（本机网络），CI 上覆盖回 npmjs
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 覆盖层比对在 check-web-overlay 作业里单独跑（全新检出需先 vendor，见那里）
      - run: pnpm -r exec tsc --noEmit
      - run: pnpm test

  test-postgres:
    name: 跨方言测试（PostgreSQL）
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      # 未配置时该套件会整体 skip；这里配置了就必须真的连上并全绿
      NAVHUB_TEST_DATABASE_URL: postgres://navhub:navhub@127.0.0.1:5432/navhub_test
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: navhub
          POSTGRES_PASSWORD: navhub
          POSTGRES_DB: navhub_test
        ports:
          - 5432:5432
        # 健康检查：等 PG 真正就绪再跑测试（避免 CI 抖动的连接失败）
        options: >-
          --health-cmd "pg_isready -U navhub -d navhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 只跑 PG 套件（SQLite 套件在 test-sqlite job 已覆盖）
      - run: pnpm exec vitest run packages/store/test/pg-dialect.e2e.test.ts

  check-web-overlay:
    name: 覆盖层一致性检查
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/web 是 gitignore 的生成物：全新检出只剩 12 个已跟踪文件，直接比对必然“缺失”
      # （这正是 main 长期红灯的原因）。先用 vendor 重建 apps/web = 上游 + overlay，
      # overlay 覆写优先，之后比对即为真；顺带也 smoke test 了 Docker/vendor 这条路径。
      - run: node scripts/vendor-web.mjs
      # overlay 是 Docker 构建与 vendor 的事实源；apps/web 改了没同步回去会在这里失败
      - run: node scripts/check-web-overlay.mjs

  audit:
    name: 依赖审计（允许失败）
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 先只告警不卡门：历史漏洞清零后再去掉 continue-on-error 转为硬门禁
      - run: pnpm audit --audit-level high
        continue-on-error: true
