# ==============================================================================
# NavHub (znwzdh) 统一 CI 工作流
#
# 覆盖矩阵：
# 1. test-sqlite（Lite 模式 / 默认引擎）:
#    - 全 Monorepo 类型检查（pnpm typecheck）
#    - 全量 Vitest（SQLite + sqlite-vec + FTS5 CJK 二元分词）
#    - 核心包与 SDK 打包构建（pnpm build）
# 2. test-postgres（Standard 模式 / 企业跨方言引擎）:
#    - pgvector 服务容器注入 NAVHUB_TEST_DATABASE_URL
#      （pg-dialect.e2e.test.ts 与 scripts/pg-check.mts 都只认这个变量名，
#       设成 DATABASE_URL 是没人读的死变量——PG 测试会整套静默 skip，假绿灯）
#    - pg-dialect 跨方言 E2E（12 项断言）+ pg-check.mts 标准模式 12 项基准检验
# 3. check-web-overlay:
#    - vendor 重建 apps/web 后与 overlay 字节级比对（全新检出的前提，见作业内注释）
# 4. audit: 依赖审计（continue-on-error，先告警不卡门）
# 5. ci-passed:
#    - 聚合闸门作业，供 GitHub 分支保护规则 (Branch Protection Rules) 设置单一必经项
# ==============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 最小权限 + 同分支新 push 自动取消旧运行
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 覆盖仓库本地 .npmrc 的国内镜像源，在 GitHub CI 环境直连官方源以保证网络高可靠
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  test-sqlite:
    name: 测试（SQLite 默认方言）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 覆盖层比对在 check-web-overlay 作业里单独跑（全新检出需先 vendor，见那里）
      - run: pnpm run typecheck
      - run: pnpm test
      # 打包构建闸门：tsc 能过但声明导出/入口路径坏了只有 build 能发现
      - run: pnpm build

  test-postgres:
    name: 跨方言测试（PostgreSQL）
    runs-on: ubuntu-latest
    env:
      # 未配置时该套件会整体 skip；这里配置了就必须真的连上并全绿
      NAVHUB_TEST_DATABASE_URL: postgres://navhub:navhub@127.0.0.1:5432/navhub_test
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: navhub
          POSTGRES_PASSWORD: navhub
          POSTGRES_DB: navhub_test
        ports:
          - 5432:5432
        # 健康检查：等 PG 真正就绪再跑测试（避免 CI 抖动的连接失败）
        options: >-
          --health-cmd "pg_isready -U navhub -d navhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 只跑 PG 套件（SQLite 套件在 test-sqlite job 已覆盖）
      - run: pnpm exec vitest run packages/store/test/pg-dialect.e2e.test.ts
      # 标准模式 12 项真实数据库方言基准检验（同样只认 NAVHUB_TEST_DATABASE_URL）
      - run: pnpm test:pg

  check-web-overlay:
    name: 覆盖层一致性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/web 是 gitignore 的生成物：全新检出只剩 12 个已跟踪文件，直接比对必然"缺失"
      # （这正是 main 长期红灯的原因）。先用 vendor 重建 apps/web = 上游 + overlay，
      # overlay 覆写优先，之后比对即为真；顺带也 smoke test 了 Docker/vendor 这条路径。
      - run: node scripts/vendor-web.mjs
      # overlay 是 Docker 构建与 vendor 的事实源；apps/web 改了没同步回去会在这里失败
      - run: node scripts/check-web-overlay.mjs

  audit:
    name: 依赖审计（允许失败）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 先只告警不卡门：历史漏洞清零后再去掉 continue-on-error 转为硬门禁
      - run: pnpm audit --audit-level high
        continue-on-error: true

  ci-passed:
    name: CI 整体通过 (All Checks Passed)
    runs-on: ubuntu-latest
    needs: [test-sqlite, test-postgres, check-web-overlay, audit]
    if: always()
    steps:
      - name: 评估检查结果
        run: |
          if [ "${{ needs.test-sqlite.result }}" != "success" ] || \
             [ "${{ needs.test-postgres.result }}" != "success" ] || \
             [ "${{ needs.check-web-overlay.result }}" != "success" ] || \
             [ "${{ needs.audit.result }}" != "success" ]; then
            echo "CI 检查未全部通过！"
            echo "SQLite:  ${{ needs.test-sqlite.result }}"
            echo "PG:      ${{ needs.test-postgres.result }}"
            echo "Overlay: ${{ needs.check-web-overlay.result }}"
            echo "Audit:   ${{ needs.audit.result }}"
            exit 1
          fi
          echo "🎉 所有 CI 检查均已顺利通过！"
