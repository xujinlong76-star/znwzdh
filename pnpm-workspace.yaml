packages:
  - 'packages/*'
  - 'apps/*'
  # apps/web-overlay 是「覆盖层镜像」而不是独立包：它的 package.json 只是
  # apps/web 清单的一份副本（Docker/vendor 用来保证前端依赖与自研改动同步）。
  # 不排除的话，pnpm 会把它当成第二个名为 navsphere 的 workspace 项目，
  # `pnpm --filter navsphere` 会同时命中两个目录，tsc/build 在 overlay 里跑并失败。
  - '!apps/web-overlay'

# 版本锁定：包管理器版本由根 package.json 的 `packageManager: pnpm@11.7.0` 声明，
# 启用 corepack 后自动锁定（`corepack enable && corepack install`），
# 与 Dockerfile / CI 里的 pnpm@11.7.0 保持一致。

# 安装期构建脚本白名单（pnpm 11 的配置位置）
#  - better-sqlite3:   编译原生 SQLite 扩展
#  - esbuild:          下载平台二进制（vitest / tsx 依赖）
#  - onnxruntime-node: 下载 ONNX 运行时的本地二进制（本地 embedding 必需）
#  - protobufjs:       生成 protobuf 代码（onnxruntime 依赖）
#  - sharp:            Next.js 图片优化用的原生模块（vendored 前端需要）
#  - msw / workerd:    vendored 前端的测试/边缘运行时依赖，非必需但允许其安装脚本
# pnpm 10+ 在 exec/run 前会先核对 node_modules 是否「最新」，不一致就自动 pnpm install。
# 本机这一步必炸：一是 wmic 被拦（runDepsStatusCheck 拿不到进程表），二是自动安装要
# 原子重命名 better-sqlite3 目录、而它正被测试进程占用 → EPERM（2026-10-29 实测）。
# 于是 `pnpm lint/test/typecheck` 全都跑不起来，只能绕着走。
# 关掉这层自检：CI 本来就先 `pnpm install --frozen-lockfile`，不需要 run 前再核一次；
# 本地依赖真不一致时直接跑 install 就行，不必每次 exec 都偷偷装一遍。
verifyDepsBeforeRun: false

allowBuilds:
  better-sqlite3: false
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  msw: false
  workerd: false

auditConfig:
  # GHSA-vfj7-8cjw-p6xm（braces ReDoS，CVSS 高危）
  #   - 来源：vendored 前端的 eslint 工具链间接引入（eslint-plugin-* → braces），
  #     dev-only，不进生产产物，因此生产面 audit（ci.yml 的 --prod）不受影响。
  #   - 不可 override 的原因：npm 上 braces 最新仍是 3.0.3（未发布修复版），无版本可钉。
  #   - 复审/到期：braces 发布 >=3.0.3 或上游 eslint 链移除该依赖时，删除本条恢复硬门禁；
  #     无论如何每季度（下次 2026-12-31）复核一次，避免例外永久化。
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

# zod 已全仓统一到 v4（2026-10-19 升级）：@hookform/resolvers 同步升到 5.x
# （v5 的 peer 覆盖 zod ^3.25 || ^4），此前的 v3 override 与「前端只支持 v3」
# 的约束随之解除，不再需要 overrides 钉版本。若未来再出现大版本分裂，
# 在这里恢复 override 前先读 docs/UPGRADE-PROPOSAL-V3-2026-10-19.md 的实测记录。
minimumReleaseAgeExclude:
  - '@next/env@16.4.2'
  - '@next/swc-darwin-arm64@16.4.2'
  - '@next/swc-darwin-x64@16.4.2'
  - '@next/swc-linux-arm64-gnu@16.4.2'
  - '@next/swc-linux-arm64-musl@16.4.2'
  - '@next/swc-linux-x64-gnu@16.4.2'
  - '@next/swc-linux-x64-musl@16.4.2'
  - '@next/swc-win32-arm64-msvc@16.4.2'
  - '@next/swc-win32-x64-msvc@16.4.2'
  - next@16.4.2

# ---------------------------------------------------------------------------
# overrides 到期台账（review-by）
#
# 为什么要有台账：overrides 是"永久钉版本"的机制。上游发了修复版却仍钉着，
# 既丢掉修复、又持续背维护负担（每个 override 都要同步进 Docker 的部分清单，
# 否则触发 ERR_PNPM_LOCKFILE_CONFIG_MISMATCH）。这里给每条钉版一个**复核到期日**：
# 到期复核上游是否已发修复版，能解除就解除；到期未复核视为技术债（与 ci-red-ledger
# 同一口径）。复核日统一取季度末，改动时顺延。
#
#  条目                                          依据                                 复核到期
#  brace-expansion@<2 / >=2 <5 / >=5             ReDoS GHSA-vfj7-8cjw-p6xm；>=5 放行 ESLint10  2026-12-31
#  nanoid@<4                                     GHSA-2v37-7h3g-55p8                 2026-12-31
#  sharp                                         native 依赖安全维护版               2026-12-31
#  undici                                        >=7.29.1                            2026-12-31
#  body-parser                                   express@5 经 MCP SDK 仍解析到 2.3.0（高危 DoS） 2026-12-31
#  next 16.4.2                                   硬钉：与 minimumReleaseAgeExclude 平台包绑定 2027-03-31
#  tinypool / postcss / ws / esbuild             工具链安全版本                     2026-12-31
#  nodemailer                                    GHSA-p6gq-j5cr-w38f / GHSA-8h2f-cmhf-554p 2026-12-31
#  fast-uri                                      GHSA-333x-w4r6-6crp                 2026-12-31
#  qs / ip-address                               GHSA-6pq8-jhm2-2vcw / GHSA-rxp7-6hxx-x8q5  2027-03-31
#  zod                                           GHSA-mrhx-c7xc-m3w5                2026-12-31
#  ignoreGhsas: braces（dev-only）                上游未发修复版，季度复核            2026-12-31
# ---------------------------------------------------------------------------
overrides:
  # 安全钉版本：原写在 apps/web/package.json 的 pnpm 字段里，但 pnpm 11 起不再读
  # package.json 的 pnpm 字段（overrides 迁到 pnpm-workspace.yaml），那里实际已失效。
  # 统一搬到 workspace 配置，顺带消除 Docker 只拷部分清单时的
  # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH（见 docker/Dockerfile.api 注释）。
  brace-expansion@<2: 1.1.21
  # >=2 <5 仍钉安全维护版 2.1.7；>=5 放行：ESLint 10 的 @eslint/config-array
  # 依赖 minimatch@10，后者要求 brace-expansion ^5。
  brace-expansion@>=2 <5: 2.1.7
  brace-expansion@>=5: 5.0.12
  # nanoid v3 的 ReDoS/无限循环：GHSA-2v37-7h3g-55p8，修复版 >=3.3.18。
  # 原钉 3.3.16 本身就在受影响区间（这条 overrides 从 apps/web/package.json 的
  # pnpm 字段搬进 workspace 配置、真正生效后，生产面 audit 立刻红灯）。
  nanoid@<4: 3.3.18
  sharp: '>=0.35.5'
  undici: '>=7.29.1'
  # body-parser <2.4.0 的高危 DoS（生产依赖）：express@5.3.0（经 MCP SDK）仍解析到
  # 2.3.0，而 ci.yml 的 `audit --prod --audit-level high` 因此变红。统一到修复版。
  body-parser: '>=2.4.0'
  next: 16.4.2
  tinypool: '>=2.1.2'
  postcss: '>=8.4.31'
  ws: '>=8.21.0'
  esbuild: '>=0.28.1'
  # nodemailer: GHSA-p6gq-j5cr-w38f (SSRF / 任意文件读取) & GHSA-8h2f-cmhf-554p (O(n²) DoS)
  nodemailer: '>=9.1.0'
  # fast-uri: GHSA-333x-w4r6-6crp
  fast-uri: '>=3.1.9'
  # qs: GHSA-6pq8-jhm2-2vcw（express@5.3.0 经 MCP SDK 解析到 6.16.0，修复版 >=6.16.1；
  # 与 body-parser 同例：上游 spec 钉住旧版时用全局下限抬升）
  qs: '>=6.16.1'
  # ip-address: GHSA-rxp7-6hxx-x8q5（express-rate-limit 经 MCP SDK 解析到 10.7.3，修复版 >=10.7.4）
  ip-address: '>=10.7.4'
  # zod 全仓统一使用安全版本 >=4.6.7（彻底解决 GHSA-mrhx-c7xc-m3w5 内存耗尽漏洞）
  zod: '>=4.6.7'

# 类型解析修复：以下包的 d.ts 会导入 'react' 但未把 @types/react 声明为 peer，
# pnpm 隔离安装下其实例目录内没有 @types/react，classic node10 解析使这些 d.ts
# 的 'react' 导入落到无类型运行时包（next 的 import type { ScriptHTMLAttributes }
# from 'react' 静默变 any），导致 next/script 的 ScriptProps 丢 src、cmdk 的
# CommandItem onSelect 参数丢类型、input-otp 的 context 变 unknown 等 9 处存量
# tsc 错误（此前被 incremental 缓存掩盖）。经 packageExtensions 声明 peer 后，
# pnpm 会将 @types/react 链入各自实例目录，与 recharts/radix 等天然声明
# @types/react peer 的包行为一致。纯类型依赖，零运行时影响。
packageExtensions:
  next:
    peerDependencies:
      "@types/react": "*"
      "@types/react-dom": "*"
  cmdk:
    peerDependencies:
      "@types/react": "*"
  input-otp:
    peerDependencies:
      "@types/react": "*"
