packages:
  - 'packages/*'
  - 'apps/*'
  # apps/web-overlay 是「覆盖层镜像」而不是独立包：它的 package.json 只是
  # apps/web 清单的一份副本（Docker/vendor 用来保证前端依赖与自研改动同步）。
  # 不排除的话，pnpm 会把它当成第二个名为 navsphere 的 workspace 项目，
  # `pnpm --filter navsphere` 会同时命中两个目录，tsc/build 在 overlay 里跑并失败。
  - '!apps/web-overlay'

# 版本锁定：包管理器版本由根 package.json 的 `packageManager: pnpm@11.7.0` 声明，
# 启用 corepack 后自动锁定（`corepack enable && corepack install`），
# 与 Dockerfile / CI 里的 pnpm@11.7.0 保持一致。

# 安装期构建脚本白名单（pnpm 11 的配置位置）
#  - better-sqlite3:   编译原生 SQLite 扩展
#  - esbuild:          下载平台二进制（vitest / tsx 依赖）
#  - onnxruntime-node: 下载 ONNX 运行时的本地二进制（本地 embedding 必需）
#  - protobufjs:       生成 protobuf 代码（onnxruntime 依赖）
#  - sharp:            Next.js 图片优化用的原生模块（vendored 前端需要）
#  - msw / workerd:    vendored 前端的测试/边缘运行时依赖，非必需但允许其安装脚本
allowBuilds:
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  msw: false
  workerd: false

auditConfig:
  # GHSA-vfj7-8cjw-p6xm（braces ReDoS，CVSS 高危）
  #   - 来源：vendored 前端的 eslint 工具链间接引入（eslint-plugin-* → braces），
  #     dev-only，不进生产产物，因此生产面 audit（ci.yml 的 --prod）不受影响。
  #   - 不可 override 的原因：npm 上 braces 最新仍是 3.0.3（未发布修复版），无版本可钉。
  #   - 复审/到期：braces 发布 >=3.0.3 或上游 eslint 链移除该依赖时，删除本条恢复硬门禁；
  #     无论如何每季度（下次 2026-12-31）复核一次，避免例外永久化。
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

# zod 已全仓统一到 v4（2026-10-19 升级）：@hookform/resolvers 同步升到 5.x
# （v5 的 peer 覆盖 zod ^3.25 || ^4），此前的 v3 override 与「前端只支持 v3」
# 的约束随之解除，不再需要 overrides 钉版本。若未来再出现大版本分裂，
# 在这里恢复 override 前先读 docs/UPGRADE-PROPOSAL-V3-2026-10-19.md 的实测记录。
minimumReleaseAgeExclude:
  - '@next/env@16.4.2'
  - '@next/swc-darwin-arm64@16.4.2'
  - '@next/swc-darwin-x64@16.4.2'
  - '@next/swc-linux-arm64-gnu@16.4.2'
  - '@next/swc-linux-arm64-musl@16.4.2'
  - '@next/swc-linux-x64-gnu@16.4.2'
  - '@next/swc-linux-x64-musl@16.4.2'
  - '@next/swc-win32-arm64-msvc@16.4.2'
  - '@next/swc-win32-x64-msvc@16.4.2'
  - next@16.4.2

overrides:
  # 安全钉版本：原写在 apps/web/package.json 的 pnpm 字段里，但 pnpm 11 起不再读
  # package.json 的 pnpm 字段（overrides 迁到 pnpm-workspace.yaml），那里实际已失效。
  # 统一搬到 workspace 配置，顺带消除 Docker 只拷部分清单时的
  # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH（见 docker/Dockerfile.api 注释）。
  brace-expansion@<2: 1.1.18
  brace-expansion@>=2: 2.1.4
  # nanoid v3 的 ReDoS/无限循环：GHSA-2v37-7h3g-55p8，修复版 >=3.3.18。
  # 原钉 3.3.16 本身就在受影响区间（这条 overrides 从 apps/web/package.json 的
  # pnpm 字段搬进 workspace 配置、真正生效后，生产面 audit 立刻红灯）。
  nanoid@<4: 3.3.18
  sharp: '>=0.35.5'
  undici: '>=7.29.1'
  next: 16.4.2
  tinypool: '>=2.1.2'
  postcss: '>=8.4.31'
  ws: '>=8.21.0'
  esbuild: '>=0.28.1'

# 类型解析修复：以下包的 d.ts 会导入 'react' 但未把 @types/react 声明为 peer，
# pnpm 隔离安装下其实例目录内没有 @types/react，classic node10 解析使这些 d.ts
# 的 'react' 导入落到无类型运行时包（next 的 import type { ScriptHTMLAttributes }
# from 'react' 静默变 any），导致 next/script 的 ScriptProps 丢 src、cmdk 的
# CommandItem onSelect 参数丢类型、input-otp 的 context 变 unknown 等 9 处存量
# tsc 错误（此前被 incremental 缓存掩盖）。经 packageExtensions 声明 peer 后，
# pnpm 会将 @types/react 链入各自实例目录，与 recharts/radix 等天然声明
# @types/react peer 的包行为一致。纯类型依赖，零运行时影响。
packageExtensions:
  next:
    peerDependencies:
      "@types/react": "*"
      "@types/react-dom": "*"
  cmdk:
    peerDependencies:
      "@types/react": "*"
  input-otp:
    peerDependencies:
      "@types/react": "*"
