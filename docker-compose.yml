# DEPRECATED（已废弃）：根 docker-compose.yml 为历史简版（api + web 双服务）。
# 新部署请使用 docker/docker-compose.yml（5 服务 / 4 profile）。
# 本文件仅保留兼容，不再演进；CI 不再引用它。
version: '3.8'

services:
  navhub-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "apps/api/src/main.ts"]
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - NAVHUB_PORT=8787
      - NAVHUB_HOST=0.0.0.0
      - NAVHUB_DB_PATH=/app/data/navhub.db
    volumes:
      - navhub-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  navhub-web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "scripts/run.mjs", "--filter", "navsphere", "start"]
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NAVHUB_STORAGE_BASE_URL=http://navhub-api:8787
      - NEXT_PUBLIC_API_URL=http://localhost:8787
      - NEXT_PUBLIC_NAVHUB_API_URL=http://localhost:8787
    depends_on:
      navhub-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  navhub-data:
    driver: local
