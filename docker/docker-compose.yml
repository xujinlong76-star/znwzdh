# NavHub Docker Compose
#
# 位置说明：本文件位于 docker/ 目录下，请在该目录执行 compose：
#   cd docker && docker compose up -d
#
# 之所以放在这里而不是仓库根：compose 的相对路径是相对**文件所在目录**解析的，
# 放在根目录时会因为路径拼接产生 C:\Users\<user>\docker 这类解析错误。
#
# 用法：
#   docker compose up -d                                   # lite：仅中枢（SQLite，单容器零外部依赖）
#   docker compose --profile web up -d                     # 追加 Web 前端（从 NavSphere 底座构建）
#   docker compose -f docker-compose.yml -f docker-compose.standard.yml --profile standard up -d                # PostgreSQL + pgvector（多用户/公开站）
#     standard 的服务（postgres、api-standard）定义在 docker-compose.standard.yml，需与本文件叠加使用。
#     注意：lite 的 api 没有 profile，会被一起带起来，所以 standard 的中枢
#     映射到宿主机 **8788**（NAVHUB_STANDARD_PORT 可改）。要让 web 读 standard，
#     再设 NAVHUB_WEB_API_URL=http://api-standard:8787。
#   NAVHUB_MCP_TOKEN=xxx docker compose --profile mcp up -d # 追加 MCP HTTP（供远程 AI 客户端）
#     standard 部署还要设 NAVHUB_MODE=standard 与 NAVHUB_MCP_DATABASE_URL=...，
#     否则 MCP 读的是 /data/navhub.db 而不是 Postgres（两边数据会分叉）。
#
# 生产身份闸门（security-readiness.ts）：容器内固定 NODE_ENV=production。
#   内网 / NAS 开放模式（未配 NAVHUB_IDENTITY_SECRET）：首次启动需设
#     NAVHUB_ALLOW_UNSIGNED_IDENTITY=1（显式承认「任何请求可自称 userId/anonId」）。
#   公网部署：设 NAVHUB_AUTH_REQUIRED=1 + NAVHUB_IDENTITY_SECRET（≥32 字符）。
#   两者都不满足时中枢拒绝启动（fail-closed），错误信息会给出这两条修复路径。
#
# 说明：
#  - embedding 模型在首次启动时下载到 /data/models（约 24MB，来自 hf-mirror）。
#    完全离线部署：把模型目录预先挂载到 /data/models。
#  - 种子数据默认自动导入（NAVHUB_SEED_ON_START=1），50 个真实中文站点。

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        # Docker Hub 不可达时可覆盖为镜像源地址
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        # Docker Hub 不可达时指向镜像源；deb.debian.org 被中断时可换 APT 镜像
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    image: navhub/api:0.1.0
    container_name: navhub-api
    restart: unless-stopped
    ports:
      - "${NAVHUB_PORT:-8787}:8787"
    volumes:
      - navhub-data:/data
      # 密钥分离（A14）：session secret 落独立卷，不与数据库同卷
      - navhub-secrets:/secrets
    environment:
      NAVHUB_MODE: lite
      NAVHUB_SQLITE_PATH: /data/navhub.db
      NAVHUB_EMBEDDING_CACHE: /data/models
      NAVHUB_EMBEDDING_ENDPOINT: ${NAVHUB_EMBEDDING_ENDPOINT:-https://hf-mirror.com}
      NAVHUB_LLM_BASE_URL: ${NAVHUB_LLM_BASE_URL:-https://api.agnes-ai.cn/v1}
      NAVHUB_LLM_API_KEY: ${NAVHUB_LLM_API_KEY:-}
      NAVHUB_LLM_MODEL: ${NAVHUB_LLM_MODEL:-agnes-3.0-flash}
      # .env.example 承诺过的其余 LLM 调参项必须一起透传，否则「照文档写了却没效果」。
      # 尤其 NAVHUB_LLM_ALLOW_PRIVATE：本地 Ollama/llama.cpp 没有 API Key，
      # 不透传它就只能得到「尚未配置可用的模型密钥」，对自托管用户是条死路。
      NAVHUB_LLM_NAME: ${NAVHUB_LLM_NAME:-}
      NAVHUB_LLM_TIMEOUT_MS: ${NAVHUB_LLM_TIMEOUT_MS:-}
      NAVHUB_LLM_MAX_TOKENS: ${NAVHUB_LLM_MAX_TOKENS:-}
      NAVHUB_LLM_TEMPERATURE: ${NAVHUB_LLM_TEMPERATURE:-}
      NAVHUB_LLM_JSON_MODE: ${NAVHUB_LLM_JSON_MODE:-}
      NAVHUB_LLM_THINKING: ${NAVHUB_LLM_THINKING:-}
      NAVHUB_LLM_ALLOW_PRIVATE: ${NAVHUB_LLM_ALLOW_PRIVATE:-}
      # 大盘折算花费用的单价（¥/1K token）；不透传就等于管理员永远只能看到「未配置」
      NAVHUB_LLM_COST_PER_1K_TOKENS: ${NAVHUB_LLM_COST_PER_1K_TOKENS:-}
      # LLM 额度闸门（三档 × 次数/Token，语义见 .env.example）。
      # 这里一律 `${VAR:-}` 而不是写死数字兜底：compose 里写死会让 .env 的同名项
      # 在「有人删掉自己那行」时被这里的值悄悄接管；空串由 config.ts 的 num() 读成
      # 「未配置」，仍旧落到代码默认值。
      NAVHUB_LLM_QUOTA_IDENTITY_CALLS: ${NAVHUB_LLM_QUOTA_IDENTITY_CALLS:-}
      NAVHUB_LLM_QUOTA_IDENTITY_TOKENS: ${NAVHUB_LLM_QUOTA_IDENTITY_TOKENS:-}
      NAVHUB_LLM_QUOTA_ANON_CALLS: ${NAVHUB_LLM_QUOTA_ANON_CALLS:-}
      NAVHUB_LLM_QUOTA_ANON_TOKENS: ${NAVHUB_LLM_QUOTA_ANON_TOKENS:-}
      NAVHUB_LLM_QUOTA_SYSTEM_CALLS: ${NAVHUB_LLM_QUOTA_SYSTEM_CALLS:-}
      NAVHUB_LLM_QUOTA_SYSTEM_TOKENS: ${NAVHUB_LLM_QUOTA_SYSTEM_TOKENS:-}
      # 并发预留（升级改造方案 P0-3）：不透传就只能永远用代码默认值，
      # 而在多副本部署里「闸门拦不住并发」正是这两项存在的唯一理由。
      NAVHUB_LLM_QUOTA_RESERVE_TOKENS: ${NAVHUB_LLM_QUOTA_RESERVE_TOKENS:-}
      NAVHUB_LLM_QUOTA_TTL_MS: ${NAVHUB_LLM_QUOTA_TTL_MS:-}
      # 显式关掉整个闸门才允许生产环境六档全 0（config.ts 会为此拒绝启动）
      NAVHUB_LLM_QUOTA_DISABLED: ${NAVHUB_LLM_QUOTA_DISABLED:-}
      # 不设公开可查的默认值（升级改造方案 P0-1）：未显式提供时由
      # entrypoint.sh 生成随机值并持久化到密钥文件，api 与 web 共享同一份；
      # 显式设置则优先生效。密钥文件默认 /data/.session-secret，这里指向
      # 独立的 navhub-secrets 卷（A14 密钥分离：备份库外流不连带丢密钥）。
      NAVHUB_SESSION_SECRET: ${NAVHUB_SESSION_SECRET:-}
      NAVHUB_SESSION_SECRET_FILE: ${NAVHUB_SESSION_SECRET_FILE:-/secrets/.session-secret}
      # X-Forwarded-For 信任度。取值：0 不读（默认）/ 1 信任整条链 / 可信代理网段列表。
      # 默认关：本文件把 8787 直接 publish 到宿主机，前面没有必然存在的反向代理，
      # 开启后客户端每个请求换一个伪造 XFF 就能换一个限流桶（300/min、投稿 5/hour 全部失效）。
      # 前面确实有 nginx/caddy/traefik 时，别用 1（那是采信客户端自报的最左值），
      # 用网段列表，例如 NAVHUB_TRUST_PROXY="loopback, 172.16.0.0/12"
      # —— 只有对端落在这些网段才解析 XFF，且取的是「代理实际看到的那一跳」。
      # 注意：profile web 的 Next.js /api/hub/* 代理只转发客户端带来的 XFF、无法追加对端地址
      # （Next 15 路由处理器拿不到 socket IP），单独跑 api+web 时开着它并不等于可信。
      NAVHUB_TRUST_PROXY: ${NAVHUB_TRUST_PROXY:-0}
      # 默认仅本地前端（http://localhost:3000 / http://127.0.0.1:3000）：
      # 浏览器侧调用全部走 Next.js BFF 同源代理，不直连 8787。
      # 生产请显式写白名单，例如 NAVHUB_CORS_ORIGINS=https://nav.example.com
      # （NODE_ENV=production 且显式设为 * 时，启动日志会打一条警告。）
      NAVHUB_CORS_ORIGINS: ${NAVHUB_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      NAVHUB_SEED_ON_START: ${NAVHUB_SEED_ON_START:-1}
      # 默认开启（2026-11-09 S-2）：生产默认鉴权，避免「上线即裸奔」。
      # 开启后用 NAVHUB_BOOTSTRAP_TOKEN 创建正式 token，再删除该变量重启。
      # 真正要开放模式的仅限本机部署：显式 NAVHUB_AUTH_REQUIRED=0 +
      # NAVHUB_ALLOW_INSECURE_LOCALHOST=1 + 回环 NAVHUB_PUBLIC_URL，三者缺一启动即失败。
      NAVHUB_AUTH_REQUIRED: ${NAVHUB_AUTH_REQUIRED:-1}
      # 鉴权开启后**唯一**的首个凭据入口（server.ts 里与 Bearer token 恒定时间比较）。
      # 引导出正式 token 后请删除本变量重启，否则这个长期有效的引导凭据一直可用。
      NAVHUB_BOOTSTRAP_TOKEN: ${NAVHUB_BOOTSTRAP_TOKEN:-}
      # 管理面静态凭据（生产必填）：与 SESSION_SECRET 分开保管，
      # NODE_ENV=production 且 ADMIN/BOOTSTRAP 都缺失时容器拒绝启动。
      NAVHUB_ADMIN_TOKEN: ${NAVHUB_ADMIN_TOKEN:-}
      # 开放模式（AUTH_REQUIRED=0）的显式承认阀：仅回环 publicUrl 生效，且必须置 1。
      # NAVHUB_ALLOW_INSECURE_PUBLIC 已不再能免除启动阻断。
      NAVHUB_ALLOW_INSECURE_LOCALHOST: ${NAVHUB_ALLOW_INSECURE_LOCALHOST:-0}
      # 中枢对外的规范地址。默认 localhost 是**显式声明内网部署**：生产环境未开鉴权时
      # config.ts 要求本变量必须有值，缺省会让容器启动即拒绝（fail-closed）。
      # 公网部署请改成真实域名，并把同一个值同时填给 web 服务的 NAVHUB_SITE_URL
      #（canonical/sitemap 用它）。
      NAVHUB_PUBLIC_URL: ${NAVHUB_PUBLIC_URL:-http://localhost:8787}
      # 密钥轮换窗口：新签发只用 SESSION_SECRET，旧签名在窗口内仍被接受。
      # compose 不传这个变量就等于「轮换做不了」（详见 .env.example）。
      NAVHUB_SESSION_SECRET_PREV: ${NAVHUB_SESSION_SECRET_PREV:-}
      # 任务重试耗尽时的告警投递（main.ts 横幅会打印是否已配置）。
      NAVHUB_ALERT_WEBHOOK: ${NAVHUB_ALERT_WEBHOOK:-}
      # 终端用户身份签名密钥。**必须与下面 web 服务里的同名变量取值完全一致**。
      # 为什么不像 SESSION_SECRET 那样自动生成：自动配上就等于**默认开启**签名校验，
      # 而只有 Web 的 /api/hub/* 代理会自动签名，直连中枢的消费者
      # （浏览器扩展、MCP、自建脚本）带的 anonId/userId 会立刻全部 401。
      # 所以这里保持「空 = 不校验」的历史行为，由运维显式开启。
      # ⚠️ 但 AUTH_REQUIRED=1 时它不再是可选项：容器里 NODE_ENV=production，
      # 中枢在装配路由前会校验「鉴权开启 → 必须有 ≥32 字符的身份签名密钥」并
      # **拒绝启动**。本变量没往容器里透传时，那条路径会变成无法配置的崩溃重启循环
      # —— 只能改 compose（就是这一行）。
      # 开启后每个带身份的请求都要 x-navhub-identity-signature = HMAC-SHA256(secret, identity)。
      NAVHUB_IDENTITY_SECRET: ${NAVHUB_IDENTITY_SECRET:-}
      # 生产身份签名总闸（security-readiness.ts）：容器固定 NODE_ENV=production，
      # 未配 NAVHUB_IDENTITY_SECRET 时必须显式设 1 承认「任何请求可自称 userId/anonId」，
      # 否则中枢拒绝启动（fail-closed）。个人 / NAS 内网部署：设 NAVHUB_ALLOW_UNSIGNED_IDENTITY=1；
      # 公网部署请改用 NAVHUB_AUTH_REQUIRED=1 + ≥32 字符密钥（推荐）。
      NAVHUB_ALLOW_UNSIGNED_IDENTITY: ${NAVHUB_ALLOW_UNSIGNED_IDENTITY:-0}
      # 身份签名严格模式（2026-11-06 深扫 C-1）：旧版本 .env.example / compose / parity-test
      # 三处都没有这个变量，容器里运维没有任何开关能开启 v2-only；v1 可被剥头降级重放。
      # 三个服务必须同值，由 compose-env-parity.test.ts 断言。
      NAVHUB_IDENTITY_SIGNATURE_STRICT: ${NAVHUB_IDENTITY_SIGNATURE_STRICT:-0}
      # 定时采集 cron 端点凭据（C-4）：cron-auth.ts 未配置即 503 fail-closed，
      # 与 .github/workflows/video-harvest.yml 的 secrets.CRON_SECRET 必须同值。
      CRON_SECRET: ${CRON_SECRET:-}
      # 限流豁免凭据（与 web 服务必须同值；留空 = 零豁免，行为同历史）。
      # 见 .env.example 与 docs/seo/ISR-ROUTES.md 5.9：不带它时 web 层 SSR 取数与访客抢同一个 300/min 桶。
      NAVHUB_INTERNAL_TOKEN: ${NAVHUB_INTERNAL_TOKEN:-}
    healthcheck:
      # /api/ready 会真实 ping 数据库/存储；/api/health 只证明进程活着，
      # 数据库挂掉时容器仍会显示 healthy（restart 策略也就永远不会触发）。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # main.ts 先 drain 任务与请求（最多 30s）再退出；默认 10s 会在排空中途 SIGKILL，
    # 留下 running 状态的僵尸任务与半写请求。
    stop_grace_period: 45s
    # ---- 资源上限示例（默认关闭，保持现有可运行性） ----
    # 公开部署建议取消注释，防止 embedding/检索把宿主机内存吃光：
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    #       memory: 2G
    #     reservations:
    #       memory: 512M

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        # 默认必须是**具体 commit**，不是分支名：`${NAVSPHERE_REF:-main}` 会让每次构建
        # 拉一条会动的分支，同一个仓库标签构建出不同镜像，也把 vendor 脚本 / Dockerfile.web
        # 里的 pin 变成摆设（node scripts/check-upstream-ref.mjs 现在会连这里一起校验）。
        NAVSPHERE_REF: ${NAVSPHERE_REF:-6ba74fab9f86aa6ba4e276c002128a8f5a0acc0a}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        # Docker Hub 不可达时指向镜像源；deb.debian.org 被中断时可换 APT 镜像
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        # CSP 是构建期变量：Next 的 headers() 在 next build 时固化进 routes-manifest，
        # 运行时往 environment 注入 NAVHUB_CSP 不会生效。这三个参数必须与
        # docker/Dockerfile.web:72-74 的 ARG 同名并经 build.args 透传；
        # 默认空保持存量部署兼容，需要 CSP 时：NAVHUB_CSP=1 docker compose build web。
        NAVHUB_CSP: ${NAVHUB_CSP:-}
        NAVHUB_CSP_REPORT_ONLY: ${NAVHUB_CSP_REPORT_ONLY:-}
        NAVHUB_CSP_REPORT_URI: ${NAVHUB_CSP_REPORT_URI:-}
    image: navhub/web:0.1.0
    container_name: navhub-web
    profiles: ["web"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${NAVHUB_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # 与 api 共享 session secret：api 入口把它生成到密钥文件，web 只读复用，
    # 保证两容器 session 签名密钥一致且重启不失效（方案 P0-1）。密钥文件在
    # 独立的 navhub-secrets 卷（A14 密钥分离）；/data:ro 保留给其它只读用途。
    # 只读挂载：web 入口只 cat 密钥文件（entrypoint-web.sh 里没有任何写操作），
    # 给它写权限等于让前端容器能改中枢的密钥或数据库。
    volumes:
      - navhub-data:/data:ro
      - navhub-secrets:/secrets:ro
    environment:
      STORAGE_ADAPTER: http
      # 指向哪个中枢必须可覆盖：--profile standard 跑的是 api-standard，
      # 写死 http://api:8787 等于让前端读 lite 容器里那个 SQLite，
      # 而运营看到的数据在 Postgres 里（两边都"健康"，只是不是同一份数据）。
      # 注意 NEXT_PUBLIC_* 在 next build 时被内联进浏览器包：这里的运行时覆盖只对
      # 服务端 route handler / lib 生效（本仓库引用它的 8 处都在服务端），客户端代码
      # 仍需要用同名 build-arg 重新构建镜像。
      NEXT_PUBLIC_API_URL: ${NAVHUB_WEB_API_URL:-http://api:8787}
      NAVHUB_STORAGE_BASE_URL: ${NAVHUB_WEB_API_URL:-http://api:8787}
      # 对外站点的唯一 origin（canonical/sitemap/OG 都靠它）。公网部署必须显式
      # 设置，否则会退化为请求 Host 推导，反代配置错误时整站 canonical 会写错。
      NAVHUB_SITE_URL: ${NAVHUB_SITE_URL:-}
      # Server Action 的 Origin 白名单（next.config.js 运行时读取）。生产域名
      # 只在部署配置里声明，不进 next.config.js；多个用逗号分隔。
      NAVHUB_SERVER_ACTION_ORIGINS: ${NAVHUB_SERVER_ACTION_ORIGINS:-}
      # 代理上游超时（毫秒）：卡死的中枢不能把前端请求无限期挂住；SSE 长连接不受影响
      NAVHUB_HUB_TIMEOUT_MS: ${NAVHUB_HUB_TIMEOUT_MS:-30000}
      NAVHUB_SESSION_SECRET: ${NAVHUB_SESSION_SECRET:-}
      # 密钥文件路径与 api 保持一致（A14）：默认 /secrets/.session-secret（独立卷）
      NAVHUB_SESSION_SECRET_FILE: ${NAVHUB_SESSION_SECRET_FILE:-/secrets/.session-secret}
      # **必须与 api 服务的同名变量完全一致**：Web 的 /api/hub/* 代理用它给转发的
      # userId/anonId 计算 HMAC 签名，中枢用同一把密钥校验。两边不同 = 站点里所有
      # 带身份的请求 401；只有中枢有、代理没有 = 同样 401（代理不会补签名头）。
      # 留空 = 两侧都不签名/不校验，等于历史行为。
      NAVHUB_IDENTITY_SECRET: ${NAVHUB_IDENTITY_SECRET:-}
      # 与 api 服务同值：web 层服务端取数（lib/server/hub.ts）靠它豁免按 IP 的限流。
      # 注意：只给服务端直连用；浏览器侧 /api/hub/* 代理带上它等于把全站访客标成内部流量。
      NAVHUB_INTERNAL_TOKEN: ${NAVHUB_INTERNAL_TOKEN:-}
      # 与 api / api-standard 同值（C-1 / C-4）：web 侧 BFF 代理与 cron 路由都要读。
      NAVHUB_IDENTITY_SIGNATURE_STRICT: ${NAVHUB_IDENTITY_SIGNATURE_STRICT:-0}
      CRON_SECRET: ${CRON_SECRET:-}
      # B 站高清解析（/api/videos/bili-parse）：操作者自己的 access_key，用于第三方解析站
      # 解锁大会员画质。以前 compose 完全没透传 → 容器里这条能力恒关，界面上那个密钥输入框骗人。
      # 只透传不兜底：这是凭据，写死默认值等于把部署者的 B 站账号公开。
      NAVHUB_BILIBILI_ACCESS_KEY: ${NAVHUB_BILIBILI_ACCESS_KEY:-}
      # 是否允许把「页面访客填的 access_key」交给第三方解析站（星之阁）。默认关：
      # 那是访客的 B 站登录凭据，替他把账号交给不受我们控制的一方不该是默认行为。
      NAVHUB_BILI_FORWARD_USER_KEY: ${NAVHUB_BILI_FORWARD_USER_KEY:-}
      # 解析出站预算：匿名可访问的出站通道，一次请求最多顺序打 6 个上游。
      # 不设闸门的后果由全体真实用户承担——出口 IP 被目标站拉黑后全都解析失败。
      NAVHUB_BILI_PARSE_MAX_CONCURRENT: ${NAVHUB_BILI_PARSE_MAX_CONCURRENT:-8}
      NAVHUB_BILI_PARSE_MAX_PER_MIN: ${NAVHUB_BILI_PARSE_MAX_PER_MIN:-12}
      # GitHub 登录 / 匿名投稿转 Issue / GA：以前 compose 完全没透传 → 容器里 GitHub
      # 登录与投稿建 Issue 恒关。只透传不兜底：CLIENT_SECRET / PAT 是凭据，别写默认值。
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_PAT: ${GITHUB_PAT:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      NAVHUB_ADMIN_IDS: ${NAVHUB_ADMIN_IDS:-}
      GA_ID: ${GA_ID:-}

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        # Docker Hub 不可达时可覆盖为镜像源地址
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        # Docker Hub 不可达时指向镜像源；deb.debian.org 被中断时可换 APT 镜像
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    image: navhub/api:0.1.0
    container_name: navhub-mcp
    profiles: ["mcp"]
    restart: unless-stopped
    command: ["node", "apps/mcp/src/http.ts"]
    ports:
      - "${NAVHUB_MCP_PORT:-8790}:8790"
    healthcheck:
      # 镜像自带的 HEALTHCHECK 打的是中枢的 :8787/api/ready；本容器跑的是 MCP 传输，
      # 沿用会永远 unhealthy（compose 看起来"起来了但一直不健康"）。
      # MCP 传输自己的探测点在 :8790/health。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8790/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - navhub-data:/data
    environment:
      NAVHUB_MCP_HTTP_HOST: 0.0.0.0
      NAVHUB_MCP_HTTP_PORT: "8790"
      # 注意：这里刻意不用 ":?" 强制校验。Compose 会**在解析期**校验所有 profile 的变量，
      # 用 ":?" 会导致仅想启动 postgres 的命令也直接失败。
      # 真正的强制校验放在 mcp/src/http.ts 启动逻辑里（未设 token 时拒绝启动并退出码 2）。
      NAVHUB_MCP_TOKEN: ${NAVHUB_MCP_TOKEN:-}
      NAVHUB_MCP_SCOPES: ${NAVHUB_MCP_SCOPES:-read,write}
      # 模式与数据库必须跟中枢一致，否则 --profile standard 下 MCP 读的是
      # /data/navhub.db（lite 那个 SQLite），REST/Web 读的却是 Postgres：
      # 同一个 token 在两边看到完全不同的数据，且没有任何报错。
      NAVHUB_MODE: ${NAVHUB_MODE:-lite}
      NAVHUB_DATABASE_URL: ${NAVHUB_MCP_DATABASE_URL:-}
      NAVHUB_SQLITE_PATH: /data/navhub.db
      NAVHUB_EMBEDDING_CACHE: /data/models
      NAVHUB_EMBEDDING_ENDPOINT: ${NAVHUB_EMBEDDING_ENDPOINT:-https://hf-mirror.com}

  # 自动备份旁路（A14）：定时对 SQLite 整库在线热备（scripts/backup.mjs：
  # integrity_check + sha256 清单 + 保留 35 份轮换），备份落独立卷
  # navhub-backups。opt-in：`docker compose --profile backup up -d`。
  # 只对 lite（SQLite）模式有意义；standard（Postgres）走 pg_dump 另行安排，
  # 不要把这个服务和 standard 一起开——它备的是 /data/navhub.db。
  backup:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    image: navhub/api:0.1.0
    container_name: navhub-backup
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      - api
    # 镜像自带 HEALTHCHECK 打的是中枢 :8787/api/ready，本容器不跑中枢，
    # 沿用会永远 unhealthy（与 mcp 服务同坑），故禁用。
    healthcheck:
      disable: true
    entrypoint: ["sh", "/app/scripts/backup-loop.sh"]
    volumes:
      # 源库所在卷：backup() 以只读方式打开源库，但 WAL 模式要读 -shm，
      # 故不做 :ro 挂载；脚本本身从不写主库文件。
      - navhub-data:/data
      - navhub-backups:/backups
    environment:
      NAVHUB_SQLITE_PATH: /data/navhub.db
      NAVHUB_BACKUP_DIR: /backups
      NAVHUB_BACKUP_KEEP: ${NAVHUB_BACKUP_KEEP:-35}
      NAVHUB_BACKUP_INTERVAL_SECONDS: ${NAVHUB_BACKUP_INTERVAL_SECONDS:-86400}
      NAVHUB_BACKUP_INITIAL_DELAY_SECONDS: ${NAVHUB_BACKUP_INITIAL_DELAY_SECONDS:-120}

volumes:
  navhub-data:
  # session secret 专用卷（A14 密钥分离）：只装密钥文件，与数据库分开备份/轮换
  navhub-secrets:
  # 自动备份输出卷（backup 服务写、恢复时读）：与数据卷分开，防同卷同毁
  navhub-backups:
