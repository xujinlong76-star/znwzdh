# DEPRECATED（已废弃）：根 docker-compose.yml 为历史简版（api + web 双服务）。
# 新部署请使用 docker/docker-compose.yml（5 服务 / 4 profile）。
# 本文件仅保留兼容，不再演进；CI 不再引用它。
version: '3.8'

services:
  navhub-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "apps/api/src/main.ts"]
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - NAVHUB_PORT=8787
      - NAVHUB_HOST=0.0.0.0
      - NAVHUB_DB_PATH=/app/data/navhub.db
      # 与 docker/docker-compose.yml 同口径：不写就等于 *（任意来源可读，且浏览器
      # 凭据模式被自动关闭）。生产请从宿主 .env 传入显式白名单，例如
      # NAVHUB_CORS_ORIGINS=https://nav.example.com
      - NAVHUB_CORS_ORIGINS=${NAVHUB_CORS_ORIGINS:-*}
    volumes:
      - navhub-data:/app/data
    restart: unless-stopped
    healthcheck:
      # /api/ready 会真实 ping 数据库；/api/health 只证明进程活着，
      # 数据库挂掉时容器仍显示 healthy，depends_on: service_healthy 就是空判据。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  navhub-web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "scripts/run.mjs", "--filter", "navsphere", "start"]
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # 站点对外地址（canonical / sitemap / OG 基准），部署时改成真实域名
      - NAVHUB_SITE_URL=http://localhost:3000
      - NAVHUB_STORAGE_BASE_URL=http://navhub-api:8787
      - NEXT_PUBLIC_API_URL=http://localhost:8787
      - NEXT_PUBLIC_NAVHUB_API_URL=http://localhost:8787
    depends_on:
      navhub-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  navhub-data:
    driver: local
