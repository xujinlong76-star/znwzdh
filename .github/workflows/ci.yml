# ==============================================================================
# NavHub (znwzdh) 统一 CI 工作流
#
# 覆盖矩阵：
# 1. test-sqlite（Lite 模式 / 默认引擎）:
#    - 全 Monorepo 类型检查（pnpm typecheck）
#    - 全量 Vitest（SQLite + sqlite-vec + FTS5 CJK 二元分词）
#    - 核心包与 SDK 打包构建（pnpm build）
# 2. test-postgres（Standard 模式 / 企业跨方言引擎）:
#    - pgvector 服务容器注入 NAVHUB_TEST_DATABASE_URL
#      （pg-dialect.e2e.test.ts 与 scripts/pg-check.mts 都只认这个变量名，
#       设成 DATABASE_URL 是没人读的死变量——PG 测试会整套静默 skip，假绿灯）
#    - pg-dialect 跨方言 E2E（12 项断言）+ pg-check.mts 标准模式 12 项基准检验
# 3. test-web（前端门禁，升级改造方案 P1-2）:
#    - vendor 重建 apps/web 后：tsc --noEmit + eslint（flat 配置）+ next build
#    - 覆盖 NavHub 自研的 166 个 overlay 文件（此前零门禁）
#    - check-isr-routes：收录型路由必须是 ISR（●），页面签名不得读 searchParams
# 4. check-isr-live（2026-10-22 新增）:
#    - CI 内自建预览（migrate + seed 的中枢 + next start 产物）跑 --live 抽查，
#      覆盖「产物跑起来之后」：必须 200、必须带 s-maxage、旧 ?page=N 必须 30x
#    - --min-checked=8 兜覆盖率：空 sitemap 时每个族只会打「跳过」，
#      0 页通过曾经会静默绿灯——那是比红灯更坏的失败。8 是按 2026-10-23 本地
#      同构复现实测的 11 页定的（见作业内注释），不是拍脑袋
#    - 就绪探测盯 /site/* 条目：中枢失联时 sitemap 仍有 9 条静态 <loc>，
#      只看「有没有 <loc>」会误判就绪，门禁随后红在覆盖率上而不是真实原因上
#    - 此前 --live 只存在于 workflow_dispatch 的 seo-audit-prod，等于每个 PR 都没跑
#    - 一次性 AUTH_SECRET 由作业现场生成：生产守卫拒绝仓库内的开发回退密钥，
#      不给的话 next start 每个请求都是 500，门禁会红在无关处
# 5. check-web-overlay:
#    - vendor 重建 apps/web 后与 overlay 字节级比对（全新检出的前提，见作业内注释）
# 6. audit: 依赖审计（硬门禁：高危漏洞直接红灯）
# 7. ci-passed:
#    - 聚合闸门作业，供 GitHub 分支保护规则 (Branch Protection Rules) 设置单一必经项
# ==============================================================================

# 供应链：第三方 action 固定到 commit SHA，注释保留可读主版本。
# 升级时用 `git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>` 取新 SHA，
# 不允许直接写可变的 @vN 标签。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 最小权限 + 同分支新 push 自动取消旧运行
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 覆盖仓库本地 .npmrc 的国内镜像源，在 GitHub CI 环境直连官方源以保证网络高可靠
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  test-sqlite:
    timeout-minutes: 20
    name: 测试（SQLite 默认方言）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 覆盖层比对在 check-web-overlay 作业里单独跑（全新检出需先 vendor，见那里）
      - run: pnpm run typecheck
      # 后端 ESLint（方案 P1-8）：apps/api / packages/store 此前零静态检查。
      # 首轮只开 no-unused-vars / no-empty / no-console 且全部为 warning，
      # 所以这里 continue-on-error：告警看得见，但不阻塞合并。
      # 全量清完告警后再去掉这一行并收紧规则。
      - run: pnpm run lint:backend
        continue-on-error: true
      # apps/web/test/*.test.ts 打的是存储接缝：github.ts 顶层 import @/lib/auth 与
      # @/navsphere/content/*.json。这些同属 gitignore 的生成物（来自上游），全新检出
      # 并不存在 —— 不先 vendor 重建 apps/web，vitest 会以
      # "Cannot find package '@/lib/auth'" 整作业失败。vendor 只重建 apps/web，
      # 而 typecheck / build 都 --filter "@navhub/*"，故不受影响。
      - run: node scripts/vendor-web.mjs
      - run: pnpm test
      # 打包构建闸门：tsc 能过但声明导出/入口路径坏了只有 build 能发现
      - run: pnpm build

  test-postgres:
    timeout-minutes: 20
    name: 跨方言测试（PostgreSQL）
    runs-on: ubuntu-latest
    env:
      # 未配置时该套件会整体 skip；这里配置了就必须真的连上并全绿
      NAVHUB_TEST_DATABASE_URL: postgres://navhub:navhub@127.0.0.1:5432/navhub_test
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: navhub
          POSTGRES_PASSWORD: navhub
          POSTGRES_DB: navhub_test
        ports:
          - 5432:5432
        # 健康检查：等 PG 真正就绪再跑测试（避免 CI 抖动的连接失败）
        options: >-
          --health-cmd "pg_isready -U navhub -d navhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 只跑 PG 套件（SQLite 套件在 test-sqlite job 已覆盖）。
      # 两个 e2e 套件共用同一实例但各自独占 schema，可并行：
      #   pg-dialect —— Repository 断言跨方言一致（public schema）
      #   rollup-pg   —— 数据治理 rollup 的 $n 占位符 / ON CONFLICT / COUNT(DISTINCT)（rollup_e2e schema）
      - run: pnpm exec vitest run packages/store/test/pg-dialect.e2e.test.ts packages/store/test/rollup-pg.e2e.test.ts
      # 标准模式 12 项真实数据库方言基准检验（同样只认 NAVHUB_TEST_DATABASE_URL）
      - run: pnpm test:pg

  test-web:
    timeout-minutes: 25
    name: 前端门禁（Web typecheck / lint / build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/web 是 gitignore 的 vendored 底座：先重建（上游 + overlay 覆写），
      # 否则 tsc/lint/build 面对的是不存在的目录（与 check-web-overlay 同款前置）
      - run: node scripts/vendor-web.mjs
      # 三门禁。背景：NavHub 自研的 166 个 overlay 文件（/admin 全部页面、
      # /api/hub 代理、navhub-api 等）此前零门禁——根 typecheck 只覆盖
      # @navhub/*，next.config 也 ignoreBuildErrors/ignoreDuringBuilds。
      # 现状基线（2026-10-16 本地实测）：tsc 0 错误、lint 0 错误 259 警告
      # （警告不卡门禁）、next build 通过——故直接按硬门禁启用。
      - run: pnpm --filter navsphere exec tsc --noEmit
      # Next 16 移除了 `next lint`（eslint-config-next@16 改为扁平配置 + ESLint CLI）。
      # 基线（2026-10-16 本地实测，Next 15 时代）：0 错误 259 警告（警告不卡门禁）。
      - run: pnpm --filter navsphere exec eslint .
      - run: pnpm --filter navsphere build
      # 首屏 JS 预算硬门禁：build 产物已就绪。阈值在 scripts/bundle-budget.json，
      # 不允许为了过门禁上调——超了先优化，再按真实产物重新定基线。
      - run: node scripts/check-bundle-budget.mjs
      # ISR 硬门禁：收录型路由（分类/分页/插件详情/站点详情/标签/合集/站点目录）必须是 ●，
      # 并且页面签名不得读 searchParams。动机：这类路由带 revalidate +
      # generateStaticParams，读了 searchParams 的未预渲染参数在按需生成时直接抛
      # DYNAMIC_SERVER_USAGE（生产 500），而 next dev / tsc / eslint 都照不出来。
      # CI 构建同样没有 NAVHUB_SITE_URL，所以这一条就是在证明「构建期不需要 origin
      # 也能预渲染 /sites」：静态渲染链（根布局 metadataBase + 站点目录）一旦把
      # siteOrigin() 的 headers() 兜底放回来，/sites 退化成 ƒ，这里立刻红灯。
      - run: node scripts/check-isr-routes.mjs

  # --live 抽查此前只存在于 seo-audit-prod（workflow_dispatch + 需要仓库变量
  # NAVHUB_SITE_URL），也就是**每个 PR 都没跑过**：ISR 快照「跑起来之后」是不是
  # 真带 s-maxage、旧 ?page=N 有没有 30x，全靠本地手工实测。
  # 这里在 CI 内自建一套（迁移 + 种子的中枢 + next start 产物），
  # 不依赖外部域名与仓库变量，所以每个 PR 都会跑。
  check-isr-live:
    timeout-minutes: 30
    name: 线上 ISR 抽查（CI 内自建预览，PR 门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/vendor-web.mjs
      # 构建期**给** origin：这个 job 测的是产物跑起来的行为，
      # 「无 origin 能否预渲染」由 test-web 里那条 check-isr-routes 负责，两条互补。
      - run: pnpm --filter navsphere build
        env:
          NAVHUB_SITE_URL: http://localhost:3000
      # migrate 与 seed 都以仓库根为 CWD：config.ts 的 NAVHUB_SQLITE_PATH 默认是
      # cwd 相对的 ./data/navhub.db（见根 package.json 的 //seed 注释）。
      # seed 不建表，所以必须先 migrate；空库会让 sitemap 为空，--live 每个族
      # 只会打「跳过」，正是 --min-checked 要拦的静默通过。
      - run: node apps/api/src/migrate.ts
      - run: pnpm seed
      # 生产守卫（apps/web/src/lib/auth.config.ts）会拒绝仓库内的开发回退密钥，
      # `next start` 走生产分支 —— 不给 AUTH_SECRET 的话预览站每个请求都是 500，
      # 这个门禁就会红在无关处。密钥只在本次作业的一次性 shell 环境里存在，
      # 不进 git、不进日志（预览站不需要能被外部登录）。
      - name: 生成一次性会话密钥
        run: node -e "console.log('AUTH_SECRET=' + require('crypto').randomBytes(32).toString('hex'))" >> "$GITHUB_ENV"
      - name: 启动中枢（后台）
        run: nohup node apps/api/src/main.ts > /tmp/hub.log 2>&1 &
        env:
          PORT: 8787
      - name: 启动 Web 产物（next start，后台）
        run: nohup node apps/web/node_modules/next/dist/bin/next start -p 3000 > /tmp/web.log 2>&1 &
        env:
          NAVHUB_SITE_URL: http://localhost:3000
      - name: ISR 线上抽查
        # 就绪判据要盯「中枢喂进来的条目」（/site/{id}），不是任意 <loc>：
        # 中枢没起时 sitemap 仍会给出 9 条纯静态条目、照样含 <loc>，探测会误判就绪，
        # 然后门禁只在 3 页上红——红在无关处，日志里看不出现在这个原因。
        #
        # --min-checked=8 的标定来自 2026-10-23 的本地同构复现（新 migrate + 新 seed
        # 库 + next start 产物，--sample=2）：白名单 9 族里实际抽到 11 页
        # （首页 1、分类 1+分页 1、站点目录 1+分页 1、插件市场 2、站点详情 2、
        # 标签 0——种子标签进不了 sitemap、合集 2）。下限取 8 留 3 页余量：
        # 单一种子数据变薄可以容忍，中枢整条链路失联（只剩 9 条静态 ⇒ 3 页）必须红。
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/sitemap.xml | grep -q "<loc>http://localhost:3000/site/"; then break; fi
            sleep 2
            if [ "$i" = "60" ]; then echo "✖ 预览站 120s 内没给出中枢喂好的 sitemap（/site/* 条目缺失）"; tail -40 /tmp/hub.log /tmp/web.log; exit 1; fi
          done
          set +e
          node scripts/check-isr-routes.mjs --live --base=http://localhost:3000 --sample=2 --min-checked=8 2>&1 | tee /tmp/isr-live.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            # 无 token 时作业日志接口是 403，能跨机器读到的只有 annotations（页面与
            # check-runs API 都公开）。红的时候把判据本身写成 ::error::，
            # 不用靠猜：覆盖几页、sitemap 几条、红在哪一族，一眼可见。
            echo "sitemap 条目数：$(curl -sf http://localhost:3000/sitemap.xml | grep -c '<loc>')"
            {
              echo "sitemap 条目数：$(curl -sf http://localhost:3000/sitemap.xml | grep -c '<loc>')"
              grep -E "^✖|^– |线上 ISR 抽查只覆盖到|未通过" /tmp/isr-live.log | cut -c1-200
            } | while IFS= read -r line; do echo "::error::${line}"; done
            exit "$rc"
          fi
      - name: 失败时留下预览站日志
        if: ${{ failure() }}
        run: tail -80 /tmp/hub.log /tmp/web.log

  check-web-overlay:
    timeout-minutes: 15
    name: 覆盖层与扩展规范性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 语法快速门禁：解析级检查，不依赖 vendor，几秒内定位标点级错误
      - run: node scripts/check-syntax.mjs
      # apps/web 是 gitignore 的生成物：全新检出只剩 12 个已跟踪文件，直接比对必然"缺失"
      # （这正是 main 长期红灯的原因）。先用 vendor 重建 apps/web = 上游 + overlay，
      # overlay 覆写优先，之后比对即为真；顺带也 smoke test 了 Docker/vendor 这条路径。
      - run: node scripts/vendor-web.mjs
      # overlay 是 Docker 构建与 vendor 的事实源；apps/web 改了没同步回去会在这里失败
      - run: node scripts/check-web-overlay.mjs
      # core 纯算法的前端运行时副本必须与 packages/core 事实源逐字节一致
      # （历史事故：13 个镜像里 9 个悄悄漂移，knowledge-graph 前端缺 computeGraphCentrality）
      - run: node scripts/sync-core-mirrors.mjs --check
      # 上游底座 ref 三处声明（vendor 脚本 / Dockerfile / UPSTREAM.md）同源，且产物未漂移
      - run: node scripts/check-upstream-ref.mjs
      # 验证浏览器扩展 (Chrome Manifest V3) 与桌面扩展 (Raycast) 的规范与文件完整性
      - run: node scripts/check-extensions.mjs

  test-e2e:
    timeout-minutes: 30
    name: 浏览器 E2E 自动化测试（Playwright）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/vendor-web.mjs
      - name: 安装 Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: 执行 Playwright E2E 测试
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          # 通过时 html reporter 不产出报告目录，默认的 warn 会在绿灯 job 上挂一条
          # "No files were found" 注解，掩盖真正的告警；失败时报告仍会被上传。
          if-no-files-found: ignore
          retention-days: 14

  docker-smoke:
    timeout-minutes: 30
    name: 镜像冒烟构建（api / web）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # CI 此前从不构建镜像：Dockerfile 坏了只有用户拉镜像时才发现。
      # 这里只验证"能构建出镜像"，不推送；Web 镜像的上游底座在 Dockerfile 内自取。
      - name: 构建 API 镜像
        run: docker build -f docker/Dockerfile.api -t navhub/api:ci .
      - name: 构建 Web 镜像
        run: docker build -f docker/Dockerfile.web -t navhub/web:ci .

  audit:
    timeout-minutes: 10
    name: 依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 依赖高危漏洞阻断（此前为 continue-on-error 软门禁，已收紧）。
      # 例外 GHSA-vfj7-8cjw-p6xm（braces，经 vendored eslint toolchain 间接引入，
      # dev-only 且上游尚未发布修复版——npm 最新仍是 3.0.3，override 无版本可钉）：
      # 待修复版发布后去掉 --ignore 并改用 overrides 钉版本。
      # 注意：必须用 --registry 显式指向 npmjs；仓库 .npmrc 固定了 npmmirror，
      # 其实测 NPM_CONFIG_REGISTRY 环境变量覆盖对 audit 不生效，会报 endpoint 不存在。
      # 全量审计：含 dev 依赖（构建链漏洞同样能打进产物）
      - run: pnpm --registry=https://registry.npmjs.org audit --audit-level high --ignore GHSA-vfj7-8cjw-p6xm
      # 生产面审计：只看法务/线上真正可触达的依赖，dev-only 告警不阻断交付
      # （--prod 会忽略 devDependencies 树，因此不需要 --ignore）
      - run: pnpm --registry=https://registry.npmjs.org audit --prod --audit-level high

  # 运行时线上检查：只对着**真实生产域名**跑，不进 PR 门禁。
  # 与 check-isr-live 的分工：那个作业在 CI 内自建预览（migrate + seed + next start），
  # 每个 PR 都跑，覆盖 ISR 抽查这一步；这里跑的是全量 SEO 审计 + 生产数据下的
  # 链接图阈值，需要仓库变量 NAVHUB_SITE_URL 指向线上，本地起不出等价条件。
  # 未配置变量时 job 直接 skip，不产生噪音；失败只让本 job 红灯并留下 artifact。
  seo-audit-prod:
    timeout-minutes: 30
    name: 运行时线上检查（生产预览，非 PR 门禁）
    if: github.event_name == 'workflow_dispatch' && vars.NAVHUB_SITE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # 无第三方依赖，无需 pnpm install。--json 把报告写到文件；
      # 发现问题时脚本退出码为 1，本 job 红灯即通知，artifact 仍会因 always() 上传。
      - name: 全量审计（sitemap 最多 2000 条）
        run: node scripts/seo-audit.mjs --base="$NAVHUB_SITE_URL" --limit=2000 --retries=2 --json > seo-audit-report.json
        env:
          NAVHUB_SITE_URL: ${{ vars.NAVHUB_SITE_URL }}
      # 线上形态的 ISR 实证：抽查收录型页面必须 200 且带 s-maxage，
      # 旧形态 /category/{slug}?page=N 必须 30x 到 /p/{N}。
      # 这一条只在 next start 的产物上有意义（dev 没有静态生成这一步）。
      - name: ISR 线上抽查
        run: node scripts/check-isr-routes.mjs --live --base="$NAVHUB_SITE_URL" --sample=2 --min-checked=8
        env:
          NAVHUB_SITE_URL: ${{ vars.NAVHUB_SITE_URL }}
      # 链接架构阈值（孤岛页 / 点击深度 / 软 404）。--from-db=none：
      # 这里没有生产库，"应有页面清单"的口径由 seo-audit 的 sitemap 覆盖。
      - name: 站内链接图阈值检查
        run: node scripts/link-graph.mjs --check --from-db=none --base="$NAVHUB_SITE_URL" --max-urls=2000
        env:
          NAVHUB_SITE_URL: ${{ vars.NAVHUB_SITE_URL }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: seo-audit-report
          path: seo-audit-report.json
          if-no-files-found: ignore
          retention-days: 14

  ci-passed:
    name: CI 整体通过 (All Checks Passed)
    runs-on: ubuntu-latest
    needs: [test-sqlite, test-postgres, test-web, check-web-overlay, check-isr-live, test-e2e, docker-smoke, audit]
    if: always()
    steps:
      - name: 评估检查结果
        run: |
          if [ "${{ needs.test-sqlite.result }}" != "success" ] || \
             [ "${{ needs.test-postgres.result }}" != "success" ] || \
             [ "${{ needs.test-web.result }}" != "success" ] || \
             [ "${{ needs.check-web-overlay.result }}" != "success" ] || \
             [ "${{ needs.check-isr-live.result }}" != "success" ] || \
             [ "${{ needs.test-e2e.result }}" != "success" ] || \
             [ "${{ needs.docker-smoke.result }}" != "success" ] || \
             [ "${{ needs.audit.result }}" != "success" ]; then
            echo "CI 检查未全部通过！"
            echo "SQLite:   ${{ needs.test-sqlite.result }}"
            echo "PG:       ${{ needs.test-postgres.result }}"
            echo "Web:      ${{ needs.test-web.result }}"
            echo "Overlay:  ${{ needs.check-web-overlay.result }}"
            echo "ISR live: ${{ needs.check-isr-live.result }}"
            echo "E2E:      ${{ needs.test-e2e.result }}"
            echo "Docker:   ${{ needs.docker-smoke.result }}"
            echo "Audit:    ${{ needs.audit.result }}"
            exit 1
          fi
          echo "🎉 所有 CI 检查均已顺利通过！"
