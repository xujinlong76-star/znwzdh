# NavHub Docker Compose
#
# 用法：
#   docker compose up -d                                   # lite：仅中枢（SQLite，单容器零外部依赖）
#   docker compose --profile web up -d                     # 追加 Web 前端（从 NavSphere 底座构建）
#   docker compose --profile standard up -d                # PostgreSQL + pgvector（多用户/公开站）
#   NAVHUB_MCP_TOKEN=xxx docker compose --profile mcp up -d # 追加 MCP HTTP（供远程 AI 客户端）
#
# 说明：
#  - embedding 模型在首次启动时下载到 /data/models（约 24MB，来自 hf-mirror）。
#    完全离线部署：把模型目录预先挂载到 /data/models。
#  - 种子数据默认自动导入（NAVHUB_SEED_ON_START=1），50 个真实中文站点。

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: navhub/api:0.1.0
    container_name: navhub-api
    restart: unless-stopped
    ports:
      - "${NAVHUB_PORT:-8787}:8787"
    volumes:
      - navhub-data:/data
    environment:
      NAVHUB_MODE: lite
      NAVHUB_SQLITE_PATH: /data/navhub.db
      NAVHUB_EMBEDDING_CACHE: /data/models
      NAVHUB_EMBEDDING_ENDPOINT: ${NAVHUB_EMBEDDING_ENDPOINT:-https://hf-mirror.com}
      NAVHUB_LLM_BASE_URL: ${NAVHUB_LLM_BASE_URL:-https://api.deepseek.com}
      NAVHUB_LLM_API_KEY: ${NAVHUB_LLM_API_KEY:-}
      NAVHUB_LLM_MODEL: ${NAVHUB_LLM_MODEL:-deepseek-chat}
      NAVHUB_SESSION_SECRET: ${NAVHUB_SESSION_SECRET:-change-me-in-production}
      NAVHUB_CORS_ORIGINS: ${NAVHUB_CORS_ORIGINS:-*}
      NAVHUB_SEED_ON_START: ${NAVHUB_SEED_ON_START:-1}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NAVSPHERE_REF: ${NAVSPHERE_REF:-main}
    image: navhub/web:0.1.0
    container_name: navhub-web
    profiles: ["web"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${NAVHUB_WEB_PORT:-3000}:3000"
    environment:
      STORAGE_ADAPTER: http
      NEXT_PUBLIC_API_URL: http://api:8787
      NAVHUB_STORAGE_BASE_URL: http://api:8787

  postgres:
    image: pgvector/pgvector:pg17
    container_name: navhub-postgres
    profiles: ["standard"]
    restart: unless-stopped
    ports:
      # 暴露给宿主机，便于本地开发时把中枢指到容器里的数据库
      # （api-standard 容器之间走 compose 网络，不依赖这个映射）
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: navhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-navhub}
      POSTGRES_DB: navhub
    volumes:
      - navhub-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navhub -d navhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-standard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: navhub/api:0.1.0
    container_name: navhub-api-standard
    profiles: ["standard"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${NAVHUB_PORT:-8787}:8787"
    volumes:
      - navhub-data:/data
    environment:
      NAVHUB_MODE: standard
      NAVHUB_DATABASE_URL: postgres://navhub:${POSTGRES_PASSWORD:-navhub}@postgres:5432/navhub
      NAVHUB_EMBEDDING_CACHE: /data/models
      NAVHUB_EMBEDDING_ENDPOINT: ${NAVHUB_EMBEDDING_ENDPOINT:-https://hf-mirror.com}
      NAVHUB_LLM_BASE_URL: ${NAVHUB_LLM_BASE_URL:-https://api.deepseek.com}
      NAVHUB_LLM_API_KEY: ${NAVHUB_LLM_API_KEY:-}
      NAVHUB_SESSION_SECRET: ${NAVHUB_SESSION_SECRET:-change-me-in-production}

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: navhub/api:0.1.0
    container_name: navhub-mcp
    profiles: ["mcp"]
    restart: unless-stopped
    command: ["node", "--experimental-strip-types", "packages/mcp/src/http.ts"]
    ports:
      - "${NAVHUB_MCP_PORT:-8790}:8790"
    volumes:
      - navhub-data:/data
    environment:
      NAVHUB_MCP_HTTP_HOST: 0.0.0.0
      NAVHUB_MCP_HTTP_PORT: "8790"
      # 注意：这里刻意不用 ":?" 强制校验。Compose 会**在解析期**校验所有 profile 的变量，
      # 用 ":?" 会导致仅想启动 postgres 的命令也直接失败。
      # 真正的强制校验放在 mcp/src/http.ts 启动逻辑里（未设 token 时拒绝启动并退出码 2）。
      NAVHUB_MCP_TOKEN: ${NAVHUB_MCP_TOKEN:-}
      NAVHUB_MCP_SCOPES: ${NAVHUB_MCP_SCOPES:-read,write}
      NAVHUB_SQLITE_PATH: /data/navhub.db
      NAVHUB_EMBEDDING_CACHE: /data/models
      NAVHUB_EMBEDDING_ENDPOINT: ${NAVHUB_EMBEDDING_ENDPOINT:-https://hf-mirror.com}

volumes:
  navhub-data:
  navhub-pg:
