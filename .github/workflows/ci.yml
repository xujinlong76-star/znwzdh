# ==============================================================================
# NavHub (znwzdh) 统一 CI 工作流
#
# 覆盖矩阵：
# 1. test（matrix: sqlite / postgres，两个矩阵腿独立成败）:
#    - Web 覆盖层一致性校验 + 全 Monorepo 类型检查 + 全量 Vitest（pnpm verify）
#    - 核心包与 SDK 打包构建（pnpm build）
#    - postgres 腿：pgvector 服务容器 + pg-dialect 跨方言 E2E（12 项断言）
#      + scripts/pg-check.mts 标准模式 12 项真实数据库方言检测（pnpm test:pg）
#    - sqlite 腿：sqlite-vec 是 packages/store 正式依赖，--frozen-lockfile 直接装，
#      不需要（也不能）在 CI 里 pnpm add——那会污染工作区且与 frozen lockfile 矛盾
# 2. ci-passed:
#    - 聚合闸门作业，供 GitHub 分支保护规则 (Branch Protection Rules) 设置单一必经项
# ==============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 覆盖仓库本地 .npmrc 的国内镜像源，在 GitHub CI 环境直连官方源以保证网络高可靠
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  test:
    name: 测试矩阵 (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      # 不让一个腿的失败取消另一个腿：双方言信号要各自独立可见
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        # 仅 postgres 腿启动服务容器
        if: matrix.db == 'postgres'
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: navhub
          POSTGRES_PASSWORD: navhub
          POSTGRES_DB: navhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U navhub -d navhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      # pg-dialect.e2e.test.ts 与 scripts/pg-check.mts 都只认 NAVHUB_TEST_DATABASE_URL。
      # 设成 DATABASE_URL 是没人读的死变量——PG 测试会整套静默 skip，postgres 腿假绿灯。
      # 空串对下游等同未设置（e2e 按 truthy 判断），sqlite 腿天然跳过 PG 测试。
      NAVHUB_TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://navhub:navhub@localhost:5432/navhub_test' || '' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 配置 Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # vector 扩展由 PgVectorStore 构造时自建（pgvector.ts:44），
      # 这里只做就绪等待；连不上时尽早明确失败，而不是让 e2e 超时后模糊报错
      - name: 等待 PostgreSQL 就绪（postgres 腿）
        if: matrix.db == 'postgres'
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U navhub -d navhub_test && exit 0
            echo "Waiting for PostgreSQL..."
            sleep 1
          done
          echo "PostgreSQL 30s 未就绪"
          exit 1
        env:
          PGPASSWORD: navhub

      - name: 覆盖层校验 + 全 Monorepo 类型检查 + 全量 Vitest
        run: pnpm verify

      - name: PostgreSQL 标准模式 12 项基准检验（postgres 腿）
        if: matrix.db == 'postgres'
        run: pnpm test:pg

      - name: 核心包与 SDK 打包构建
        run: pnpm build

  ci-passed:
    name: CI 整体通过 (All Checks Passed)
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: 评估检查结果
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "CI 检查未全部通过！"
            echo "test: ${{ needs.test.result }}"
            exit 1
          fi
          echo "🎉 所有 CI 检查均已顺利通过！"
