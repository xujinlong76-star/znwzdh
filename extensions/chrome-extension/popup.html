<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>NavHub 随身导航</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --emerald: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    .status-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .search-box {
      position: relative;
      margin-bottom: 12px;
    }
    .search-box input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: var(--primary);
    }
    .results {
      max-height: 240px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .result-item {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 6px;
      transition: transform 0.15s, border-color 0.15s;
    }
    .result-item:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    .result-title {
      font-weight: 600;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .channel-tag {
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(99, 102, 241, 0.2);
      color: var(--primary);
    }
    .result-desc {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .save-card {
      background: rgba(99, 102, 241, 0.1);
      border: 1px dashed rgba(99, 102, 241, 0.4);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .save-card h4 {
      font-size: 11px;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .save-card p {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
      word-break: break-all;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .footer-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .footer-links a {
      color: var(--primary);
      text-decoration: none;
    }
    .footer-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>🚀</span>
      <span>NavHub 随身导航</span>
    </div>
    <span class="status-badge" id="status-indicator">在线</span>
  </div>

  <div class="search-box">
    <input type="text" id="search-input" placeholder="输入自然语言或拼音搜索 (如: 写代码AI)..." autofocus>
  </div>

  <div class="results" id="search-results">
    <!-- 动态结果渲染区 -->
  </div>

  <div class="save-card">
    <h4>📥 一键收录当前网页</h4>
    <p id="current-tab-info">正在读取当前标签页...</p>
    <button class="btn" id="save-btn">AI 富化并收录到 NavHub</button>
  </div>

    <div class="save-card" style="border-style: solid; background: rgba(30, 41, 59, 0.6); padding: 8px; margin-bottom: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
      <h4 style="font-size: 11px; color: var(--muted); margin: 0;">🔑 API 鉴权 Token (用于收录权限)</h4>
    </div>
    <input type="password" id="token-input" placeholder="粘贴管理后台生成的 API Token..." style="width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; color: var(--text); font-size: 11px; outline: none;" />
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 8px 0 4px;">
      <h4 style="font-size: 11px; color: var(--muted); margin: 0;">🌐 中枢 API 地址（与地址栏搜索共用）</h4>
    </div>
    <input type="text" id="api-input" placeholder="http://127.0.0.1:8787" style="width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; color: var(--text); font-size: 11px; outline: none;" />
  </div>

  <div class="footer-links">
    <span>💡 地址栏输入 <b>nh + Tab</b> 秒搜</span>
    <a href="http://localhost:3000" target="_blank">打开完整网站 →</a>
    <a href="http://localhost:3000/marketplace" target="_blank">🧩 插件市场</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
