# NavHub Docker Compose
#
# 位置说明：本文件位于 docker/ 目录下，请在该目录执行 compose：
#   cd docker && docker compose up -d
#
# 之所以放在这里而不是仓库根：compose 的相对路径是相对**文件所在目录**解析的，
# 放在根目录时会因为路径拼接产生 C:\Users\<user>\docker 这类解析错误。
#
# 用法：
#   docker compose up -d                                   # lite：仅中枢（SQLite，单容器零外部依赖）
#   docker compose --profile web up -d                     # 追加 Web 前端（从 NavSphere 底座构建）
#   docker compose --profile standard up -d                # PostgreSQL + pgvector（多用户/公开站）
#     注意：lite 的 api 没有 profile，会被一起带起来，所以 standard 的中枢
#     映射到宿主机 **8788**（NAVHUB_STANDARD_PORT 可改）。要让 web 读 standard，
#     再设 NAVHUB_WEB_API_URL=http://api-standard:8787。
#   NAVHUB_MCP_TOKEN=xxx docker compose --profile mcp up -d # 追加 MCP HTTP（供远程 AI 客户端）
#     standard 部署还要设 NAVHUB_MODE=standard 与 NAVHUB_MCP_DATABASE_URL=...，
#     否则 MCP 读的是 /data/navhub.db 而不是 Postgres（两边数据会分叉）。
#
# 说明：
#  - embedding 模型在首次启动时下载到 /data/models（约 24MB，来自 hf-mirror）。
#    完全离线部署：把模型目录预先挂载到 /data/models。
#  - 种子数据默认自动导入（NAVHUB_SEED_ON_START=1），50 个真实中文站点。

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        # Docker Hub 不可达时可覆盖为镜像源地址
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        # Docker Hub 不可达时指向镜像源；deb.debian.org 被中断时可换 APT 镜像
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    image: navhub/api:0.1.0
    container_name: navhub-api
    restart: unless-stopped
    ports:
      - "${NAVHUB_PORT:-8787}:8787"
    volumes:
      - navhub-data:/data
    environment:
      NAVHUB_MODE: lite
      NAVHUB_SQLITE_PATH: /data/navhub.db
      NAVHUB_EMBEDDING_CACHE: /data/models
      NAVHUB_EMBEDDING_ENDPOINT: ${NAVHUB_EMBEDDING_ENDPOINT:-https://hf-mirror.com}
      NAVHUB_LLM_BASE_URL: ${NAVHUB_LLM_BASE_URL:-https://api.deepseek.com}
      NAVHUB_LLM_API_KEY: ${NAVHUB_LLM_API_KEY:-}
      NAVHUB_LLM_MODEL: ${NAVHUB_LLM_MODEL:-deepseek-chat}
      # 不设公开可查的默认值（升级改造方案 P0-1）：未显式提供时由
      # entrypoint.sh 生成随机值并持久化到 /data/.session-secret，
      # api 与 web 共享同一份；显式设置则优先生效。
      NAVHUB_SESSION_SECRET: ${NAVHUB_SESSION_SECRET:-}
      # X-Forwarded-For 信任度。取值：0 不读（默认）/ 1 信任整条链 / 可信代理网段列表。
      # 默认关：本文件把 8787 直接 publish 到宿主机，前面没有必然存在的反向代理，
      # 开启后客户端每个请求换一个伪造 XFF 就能换一个限流桶（300/min、投稿 5/hour 全部失效）。
      # 前面确实有 nginx/caddy/traefik 时，别用 1（那是采信客户端自报的最左值），
      # 用网段列表，例如 NAVHUB_TRUST_PROXY="loopback, 172.16.0.0/12"
      # —— 只有对端落在这些网段才解析 XFF，且取的是「代理实际看到的那一跳」。
      # 注意：profile web 的 Next.js /api/hub/* 代理只转发客户端带来的 XFF、无法追加对端地址
      # （Next 15 路由处理器拿不到 socket IP），单独跑 api+web 时开着它并不等于可信。
      NAVHUB_TRUST_PROXY: ${NAVHUB_TRUST_PROXY:-0}
      NAVHUB_CORS_ORIGINS: ${NAVHUB_CORS_ORIGINS:-*}
      NAVHUB_SEED_ON_START: ${NAVHUB_SEED_ON_START:-1}
      # 公网部署必须设为 1：生产 + NAVHUB_PUBLIC_URL 指向公网 + 未开鉴权 → 服务拒绝启动（fail-closed）。
      # 开启后先用 NAVHUB_BOOTSTRAP_TOKEN 创建正式 token，再删除该变量重启。
      NAVHUB_AUTH_REQUIRED: ${NAVHUB_AUTH_REQUIRED:-0}
      # 鉴权开启后**唯一**的首个凭据入口（server.ts 里与 Bearer token 恒定时间比较）。
      # 引导出正式 token 后请删除本变量重启，否则这个长期有效的引导凭据一直可用。
      NAVHUB_BOOTSTRAP_TOKEN: ${NAVHUB_BOOTSTRAP_TOKEN:-}
      # 管理面静态凭据（可选，建议与 SESSION_SECRET 分开）：设置后以其为准，
      # sessionSecret 仅保留兼容回退。轮换会话签名密钥不再连带泄露 admin。
      NAVHUB_ADMIN_TOKEN: ${NAVHUB_ADMIN_TOKEN:-}
      # NAVHUB_ALLOW_INSECURE_PUBLIC: ${NAVHUB_ALLOW_INSECURE_PUBLIC:-0}
      # 中枢对外的规范地址。默认 localhost 是**显式声明内网部署**：生产环境未开鉴权时
      # config.ts 要求本变量必须有值，缺省会让容器启动即拒绝（fail-closed）。
      # 公网部署请改成真实域名，并把同一个值同时填给 web 服务的 NAVHUB_SITE_URL
      #（canonical/sitemap 用它）。
      NAVHUB_PUBLIC_URL: ${NAVHUB_PUBLIC_URL:-http://localhost:8787}
      # 密钥轮换窗口：新签发只用 SESSION_SECRET，旧签名在窗口内仍被接受。
      # compose 不传这个变量就等于「轮换做不了」（详见 .env.example）。
      NAVHUB_SESSION_SECRET_PREV: ${NAVHUB_SESSION_SECRET_PREV:-}
      # 任务重试耗尽时的告警投递（main.ts 横幅会打印是否已配置）。
      NAVHUB_ALERT_WEBHOOK: ${NAVHUB_ALERT_WEBHOOK:-}
      # 终端用户身份签名密钥。**必须与下面 web 服务里的同名变量取值完全一致**。
      # 为什么不像 SESSION_SECRET 那样自动生成：自动配上就等于**默认开启**签名校验，
      # 而只有 Web 的 /api/hub/* 代理会自动签名，直连中枢的消费者
      # （浏览器扩展、MCP、自建脚本）带的 anonId/userId 会立刻全部 401。
      # 所以这里保持「空 = 不校验」的历史行为，由运维显式开启。
      # ⚠️ 但 AUTH_REQUIRED=1 时它不再是可选项：容器里 NODE_ENV=production，
      # 中枢在装配路由前会校验「鉴权开启 → 必须有 ≥32 字符的身份签名密钥」并
      # **拒绝启动**。本变量没往容器里透传时，那条路径会变成无法配置的崩溃重启循环
      # —— 只能改 compose（就是这一行）。
      # 开启后每个带身份的请求都要 x-navhub-identity-signature = HMAC-SHA256(secret, identity)。
      NAVHUB_IDENTITY_SECRET: ${NAVHUB_IDENTITY_SECRET:-}
    healthcheck:
      # /api/ready 会真实 ping 数据库/存储；/api/health 只证明进程活着，
      # 数据库挂掉时容器仍会显示 healthy（restart 策略也就永远不会触发）。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # main.ts 先 drain 任务与请求（最多 30s）再退出；默认 10s 会在排空中途 SIGKILL，
    # 留下 running 状态的僵尸任务与半写请求。
    stop_grace_period: 45s
    # ---- 资源上限示例（默认关闭，保持现有可运行性） ----
    # 公开部署建议取消注释，防止 embedding/检索把宿主机内存吃光：
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    #       memory: 2G
    #     reservations:
    #       memory: 512M

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        # 默认必须是**具体 commit**，不是分支名：`${NAVSPHERE_REF:-main}` 会让每次构建
        # 拉一条会动的分支，同一个仓库标签构建出不同镜像，也把 vendor 脚本 / Dockerfile.web
        # 里的 pin 变成摆设（node scripts/check-upstream-ref.mjs 现在会连这里一起校验）。
        NAVSPHERE_REF: ${NAVSPHERE_REF:-6ba74fab9f86aa6ba4e276c002128a8f5a0acc0a}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        # Docker Hub 不可达时指向镜像源；deb.debian.org 被中断时可换 APT 镜像
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    image: navhub/web:0.1.0
    container_name: navhub-web
    profiles: ["web"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${NAVHUB_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # 与 api 共享数据卷：读取 api 入口生成的 /data/.session-secret，
    # 保证两容器 session 签名密钥一致且重启不失效（方案 P0-1）。
    # 只读挂载：web 入口只 cat 这个文件（entrypoint-web.sh 里没有任何写操作），
    # 给它写权限等于让前端容器能改中枢的 navhub.db。
    volumes:
      - navhub-data:/data:ro
    environment:
      STORAGE_ADAPTER: http
      # 指向哪个中枢必须可覆盖：--profile standard 跑的是 api-standard，
      # 写死 http://api:8787 等于让前端读 lite 容器里那个 SQLite，
      # 而运营看到的数据在 Postgres 里（两边都"健康"，只是不是同一份数据）。
      # 注意 NEXT_PUBLIC_* 在 next build 时被内联进浏览器包：这里的运行时覆盖只对
      # 服务端 route handler / lib 生效（本仓库引用它的 8 处都在服务端），客户端代码
      # 仍需要用同名 build-arg 重新构建镜像。
      NEXT_PUBLIC_API_URL: ${NAVHUB_WEB_API_URL:-http://api:8787}
      NAVHUB_STORAGE_BASE_URL: ${NAVHUB_WEB_API_URL:-http://api:8787}
      # 对外站点的唯一 origin（canonical/sitemap/OG 都靠它）。公网部署必须显式
      # 设置，否则会退化为请求 Host 推导，反代配置错误时整站 canonical 会写错。
      NAVHUB_SITE_URL: ${NAVHUB_SITE_URL:-}
      # 代理上游超时（毫秒）：卡死的中枢不能把前端请求无限期挂住；SSE 长连接不受影响
      NAVHUB_HUB_TIMEOUT_MS: ${NAVHUB_HUB_TIMEOUT_MS:-30000}
      NAVHUB_SESSION_SECRET: ${NAVHUB_SESSION_SECRET:-}
      # **必须与 api 服务的同名变量完全一致**：Web 的 /api/hub/* 代理用它给转发的
      # userId/anonId 计算 HMAC 签名，中枢用同一把密钥校验。两边不同 = 站点里所有
      # 带身份的请求 401；只有中枢有、代理没有 = 同样 401（代理不会补签名头）。
      # 留空 = 两侧都不签名/不校验，等于历史行为。
      NAVHUB_IDENTITY_SECRET: ${NAVHUB_IDENTITY_SECRET:-}

  postgres:
    image: pgvector/pgvector:pg17
    container_name: navhub-postgres
    profiles: ["standard"]
    restart: unless-stopped
    ports:
      # 默认只绑回环：这个服务默认口令是 navhub，`${POSTGRES_PORT:-5432}:5432` 的写法
      # 会把带默认口令的数据库 publish 到宿主机所有网卡（公网机器上等于公开）。
      # 本机开发走 127.0.0.1:5432 不受影响；确实要对外时显式设 POSTGRES_PORT="0.0.0.0:5432"
      # 并先改掉 POSTGRES_PASSWORD。
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: navhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-navhub}
      POSTGRES_DB: navhub
    volumes:
      - navhub-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navhub -d navhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-standard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        # Docker Hub 不可达时可覆盖为镜像源地址
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        # Docker Hub 不可达时指向镜像源；deb.debian.org 被中断时可换 APT 镜像
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    image: navhub/api:0.1.0
    container_name: navhub-api-standard
    profiles: ["standard"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 必须与 lite 的 api 分开：`api` 服务没有 profile，`--profile standard` 会把它
      # 一起带起来，两个容器抢同一个宿主机 8787 → 后启动的那个直接
      # "port is already allocated"，standard 这条路径开箱就是坏的。
      - "${NAVHUB_STANDARD_PORT:-8788}:8787"
    volumes:
      - navhub-data:/data
    environment:
      NAVHUB_MODE: standard
      NAVHUB_DATABASE_URL: postgres://navhub:${POSTGRES_PASSWORD:-navhub}@postgres:5432/navhub
      NAVHUB_EMBEDDING_CACHE: /data/models
      NAVHUB_EMBEDDING_ENDPOINT: ${NAVHUB_EMBEDDING_ENDPOINT:-https://hf-mirror.com}
      NAVHUB_LLM_BASE_URL: ${NAVHUB_LLM_BASE_URL:-https://api.deepseek.com}
      NAVHUB_LLM_API_KEY: ${NAVHUB_LLM_API_KEY:-}
      # 不设公开可查的默认值（升级改造方案 P0-1）：未显式提供时由
      # entrypoint.sh 生成随机值并持久化到 /data/.session-secret，
      # api 与 web 共享同一份；显式设置则优先生效。
      NAVHUB_SESSION_SECRET: ${NAVHUB_SESSION_SECRET:-}
      # 同 api：8787 直接 publish，默认可伪造 XFF 不参与限流分桶（详见 api 服务注释）
      NAVHUB_TRUST_PROXY: ${NAVHUB_TRUST_PROXY:-0}
      # 以下四项与 api 服务保持同一组透传（语义见 api 服务里的注释）。
      # 这里漏一项，standard 模式就等于「鉴权/引导凭据/身份签名/公网 fail-closed 全都配不上」，
      # 只能改 compose 文件本身。
      NAVHUB_AUTH_REQUIRED: ${NAVHUB_AUTH_REQUIRED:-0}
      NAVHUB_BOOTSTRAP_TOKEN: ${NAVHUB_BOOTSTRAP_TOKEN:-}
      NAVHUB_ADMIN_TOKEN: ${NAVHUB_ADMIN_TOKEN:-}
      NAVHUB_IDENTITY_SECRET: ${NAVHUB_IDENTITY_SECRET:-}
      NAVHUB_PUBLIC_URL: ${NAVHUB_PUBLIC_URL:-http://localhost:8788}
      NAVHUB_SESSION_SECRET_PREV: ${NAVHUB_SESSION_SECRET_PREV:-}
      NAVHUB_ALERT_WEBHOOK: ${NAVHUB_ALERT_WEBHOOK:-}
      NAVHUB_CORS_ORIGINS: ${NAVHUB_CORS_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 45s

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        # Docker Hub 不可达时可覆盖为镜像源地址
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        # Docker Hub 不可达时指向镜像源；deb.debian.org 被中断时可换 APT 镜像
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    image: navhub/api:0.1.0
    container_name: navhub-mcp
    profiles: ["mcp"]
    restart: unless-stopped
    command: ["node", "packages/mcp/src/http.ts"]
    ports:
      - "${NAVHUB_MCP_PORT:-8790}:8790"
    healthcheck:
      # 镜像自带的 HEALTHCHECK 打的是中枢的 :8787/api/health；本容器跑的是 MCP 传输，
      # 沿用会永远 unhealthy（compose 看起来"起来了但一直不健康"）。
      # MCP 传输自己的探测点在 :8790/health。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8790/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - navhub-data:/data
    environment:
      NAVHUB_MCP_HTTP_HOST: 0.0.0.0
      NAVHUB_MCP_HTTP_PORT: "8790"
      # 注意：这里刻意不用 ":?" 强制校验。Compose 会**在解析期**校验所有 profile 的变量，
      # 用 ":?" 会导致仅想启动 postgres 的命令也直接失败。
      # 真正的强制校验放在 mcp/src/http.ts 启动逻辑里（未设 token 时拒绝启动并退出码 2）。
      NAVHUB_MCP_TOKEN: ${NAVHUB_MCP_TOKEN:-}
      NAVHUB_MCP_SCOPES: ${NAVHUB_MCP_SCOPES:-read,write}
      # 模式与数据库必须跟中枢一致，否则 --profile standard 下 MCP 读的是
      # /data/navhub.db（lite 那个 SQLite），REST/Web 读的却是 Postgres：
      # 同一个 token 在两边看到完全不同的数据，且没有任何报错。
      NAVHUB_MODE: ${NAVHUB_MODE:-lite}
      NAVHUB_DATABASE_URL: ${NAVHUB_MCP_DATABASE_URL:-}
      NAVHUB_SQLITE_PATH: /data/navhub.db
      NAVHUB_EMBEDDING_CACHE: /data/models
      NAVHUB_EMBEDDING_ENDPOINT: ${NAVHUB_EMBEDDING_ENDPOINT:-https://hf-mirror.com}

volumes:
  navhub-data:
  navhub-pg: