# CI：类型检查 + SQLite 测试 + **PostgreSQL 跨方言测试**。
#
# PG job 的意义：仓库里 Repository 的 SQL 大多双方言共用，仅占位符/布尔/聚合
# 走分支（见 packages/store/test/dialect.test.ts 对历史坑的记录）。此前 PG 侧
# 只有手工脚本 scripts/pg-check.mts，没人跑就会静默回归。这里用 postgres
# service 把 NAVHUB_TEST_DATABASE_URL 注入 packages/store/test/pg-dialect.e2e.test.ts，
# 让 PG 行为与 SQLite 断言跑同一批用例。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-sqlite:
    name: 测试（SQLite 默认方言）
    runs-on: ubuntu-latest
    env:
      # 仓库 .npmrc 固定了 npmmirror（本机网络），CI 上覆盖回 npmjs
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r exec tsc --noEmit
      - run: pnpm test

  test-postgres:
    name: 跨方言测试（PostgreSQL）
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      # 未配置时该套件会整体 skip；这里配置了就必须真的连上并全绿
      NAVHUB_TEST_DATABASE_URL: postgres://navhub:navhub@127.0.0.1:5432/navhub_test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: navhub
          POSTGRES_PASSWORD: navhub
          POSTGRES_DB: navhub_test
        ports:
          - 5432:5432
        # 健康检查：等 PG 真正就绪再跑测试（避免 CI 抖动的连接失败）
        options: >-
          --health-cmd "pg_isready -U navhub -d navhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 只跑 PG 套件（SQLite 套件在 test-sqlite job 已覆盖）
      - run: pnpm exec vitest run packages/store/test/pg-dialect.e2e.test.ts
