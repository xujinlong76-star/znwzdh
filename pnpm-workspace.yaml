packages:
  - 'packages/*'
  - 'apps/*'

# 版本锁定：包管理器版本由根 package.json 的 `packageManager: pnpm@11.7.0` 声明，
# 启用 corepack 后自动锁定（`corepack enable && corepack install`），
# 与 Dockerfile / CI 里的 pnpm@11.7.0 保持一致。

# 安装期构建脚本白名单（pnpm 11 的配置位置）
#  - better-sqlite3:   编译原生 SQLite 扩展
#  - esbuild:          下载平台二进制（vitest / tsx 依赖）
#  - onnxruntime-node: 下载 ONNX 运行时的本地二进制（本地 embedding 必需）
#  - protobufjs:       生成 protobuf 代码（onnxruntime 依赖）
#  - sharp:            Next.js 图片优化用的原生模块（vendored 前端需要）
#  - msw / workerd:    vendored 前端的测试/边缘运行时依赖，非必需但允许其安装脚本
allowBuilds:
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  msw: false
  workerd: false

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

# zod 统一固定在 v3。
# 原因：vendored 前端用 @hookform/resolvers@3 + react-hook-form，它只支持 zod v3；
# 若让前端解析到 zod v4，类型检查会直接失败
#   （Type error: ZodObject<...> is missing ... from type 'ZodType<any,any,$ZodTypeInternals>'）。
# 后端本来也能跑 v3，所以整仓统一到 v3 最省心，避免同仓两个 zod 大版本共存。
minimumReleaseAgeExclude:
  - '@next/env@15.5.28'
  - '@next/swc-darwin-arm64@15.5.28'
  - '@next/swc-darwin-x64@15.5.28'
  - '@next/swc-linux-arm64-gnu@15.5.28'
  - '@next/swc-linux-arm64-musl@15.5.28'
  - '@next/swc-linux-x64-gnu@15.5.28'
  - '@next/swc-linux-x64-musl@15.5.28'
  - '@next/swc-win32-arm64-msvc@15.5.28'
  - '@next/swc-win32-x64-msvc@15.5.28'
  - next@15.5.28

overrides:
  zod: ^3.25.76
  sharp: '>=0.35.5'
  undici: '>=7.29.1'
  next: 15.5.28
  tinypool: '>=2.1.2'
  postcss: '>=8.4.31'
  ws: '>=8.21.0'
  esbuild: '>=0.28.1'

# 类型解析修复：以下包的 d.ts 会导入 'react' 但未把 @types/react 声明为 peer，
# pnpm 隔离安装下其实例目录内没有 @types/react，classic node10 解析使这些 d.ts
# 的 'react' 导入落到无类型运行时包（next 的 import type { ScriptHTMLAttributes }
# from 'react' 静默变 any），导致 next/script 的 ScriptProps 丢 src、cmdk 的
# CommandItem onSelect 参数丢类型、input-otp 的 context 变 unknown 等 9 处存量
# tsc 错误（此前被 incremental 缓存掩盖）。经 packageExtensions 声明 peer 后，
# pnpm 会将 @types/react 链入各自实例目录，与 recharts/radix 等天然声明
# @types/react peer 的包行为一致。纯类型依赖，零运行时影响。
packageExtensions:
  next:
    peerDependencies:
      "@types/react": "*"
      "@types/react-dom": "*"
  cmdk:
    peerDependencies:
      "@types/react": "*"
  input-otp:
    peerDependencies:
      "@types/react": "*"
